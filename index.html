<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Applies any stored dark-mode override before the stylesheet even
     paints - the main script is type="module", which (like `defer`) runs
     after the document is parsed, so waiting for it would show a flash of
     the wrong theme on every reload for anyone who overrode their system
     preference. A plain classic script here runs synchronously, in order,
     immediately. No override stored = say nothing = the CSS media query
     alone already renders the right (system-following) theme with no JS
     needed at all. -->
<script>
  try {
    var t = localStorage.getItem("elysia-theme");
    if (t === "light" || t === "medium" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>

<meta property="og:title" content="elysia">
<meta property="og:description" content="a searchable database of Disco Elysium dialogue lines">
<meta property="og:site_name" content="elysia">
<meta property="og:image" content="https://arda0.net/assets/favicon">
<meta property="og:url" content="https://arda0.net/elysia/">
<link rel="icon" href="/assets/favicon">

<title>elysia - a Disco Elysium database crawler</title>
<style>
  /* Light palette (default) - every color used below is a token here so
     three tiers: light / medium / dark, chosen via the top-right slider,
     persisted in data-theme. Medium and dark share every token except
     --bg - medium is a middle-ground background, dark is the darker of
     the two despite the name suggesting otherwise: #18181b's rgb is
     ~(24,24,27), darker than medium's rgb(54,54,54). No explicit choice
     = follow the OS preference (light or dark tier only - medium is
     manual-only, there's
     no OS-level "medium" preference to map to). */
  :root {
    --bg: #fafafa;
    --bg-raised: #fff;
    --fg: #1a1a1a;
    --fg-muted: #666;
    --fg-faint: #999;
    --border: #ccc;
    --border-strong: #999;
    --link: #1a5fb4;
    --accent-bg: #333;
    --accent-fg: #fff;
    --you: #1a5fb4;
    --cross: #c33;
    --success: #1a6b2e;
    --failure: #a31212;
    --check-white-bg: #eee;
    --check-white-border: #999;
    --check-red-bg: #fdd;
    --check-red-border: #c33;
    --check-red-fg: #900;
    --check-result-white-bg: #fff;
    --check-result-red-bg: #fff5f5;
    --check-result-red-border: #e3a3a3;
    --passive-bg: #eef;
    --passive-border: #99c;
    --effect-border: #b58a2e;
    --dup-bg: #ffd54a;
    --dup-fg: #000;
    --code-fg: #333;
    --input-bg: #fff;
  }
  /* Dark-tier tokens (shared by both "medium" and "dark" - only --bg
     differs between them, overridden separately below each block).
     Redefined under BOTH the media query (so an unset preference follows
     the OS, landing on the "dark" tier specifically, never "medium") and
     the explicit attribute (so the slider wins either direction,
     including overriding an OS set to light). Listed per-block rather
     than shared via a CSS mixin/nesting construct, for broad browser
     compatibility (plain flat rules always work). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #18181b;
      --bg-raised: #232327;
      --fg: #e8e8ea;
      --fg-muted: #a3a3ab;
      --fg-faint: #75757e;
      --border: #3a3a42;
      --border-strong: #52525b;
      --link: #6ea8ff;
      --accent-bg: #e8e8ea;
      --accent-fg: #18181b;
      --you: #6ea8ff;
      --cross: #ff8080;
      --success: #5fc97e;
      --failure: #ff7a7a;
      --check-white-bg: #2a2a30;
      --check-white-border: #52525b;
      --check-red-bg: #3a2020;
      --check-red-border: #a34a4a;
      --check-red-fg: #ff9a9a;
      --check-result-white-bg: #232327;
      --check-result-red-bg: #2a1e1e;
      --check-result-red-border: #6b3939;
      --passive-bg: #24243a;
      --passive-border: #5a5aa0;
      --effect-border: #c9a24a;
      --dup-bg: #a8790a;
      --dup-fg: #fff;
      --code-fg: #d8d8da;
      --input-bg: #232327;
    }
  }
  :root[data-theme="medium"], :root[data-theme="dark"] {
    --bg-raised: #232327;
    --fg: #e8e8ea;
    --fg-muted: #a3a3ab;
    --fg-faint: #75757e;
    --border: #3a3a42;
    --border-strong: #52525b;
    --link: #6ea8ff;
    --accent-bg: #e8e8ea;
    --accent-fg: #18181b;
    --you: #6ea8ff;
    --cross: #ff8080;
    --success: #5fc97e;
    --failure: #ff7a7a;
    --check-white-bg: #2a2a30;
    --check-white-border: #52525b;
    --check-red-bg: #3a2020;
    --check-red-border: #a34a4a;
    --check-red-fg: #ff9a9a;
    --check-result-white-bg: #232327;
    --check-result-red-bg: #2a1e1e;
    --check-result-red-border: #6b3939;
    --passive-bg: #24243a;
    --passive-border: #5a5aa0;
    --effect-border: #c9a24a;
    --dup-bg: #a8790a;
    --dup-fg: #fff;
    --code-fg: #d8d8da;
    --input-bg: #232327;
  }
  :root[data-theme="medium"] { --bg: rgb(54, 54, 54); }
  :root[data-theme="dark"] { --bg: #18181b; }

  * { box-sizing: border-box; }
  body { font-family: monospace; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--fg); }
  a { color: var(--link); }
  input, select, button { font-family: monospace; font-size: 0.9rem; padding: 0.3rem; max-width: 100%; background: var(--input-bg); color: var(--fg); border: 1px solid var(--border-strong); }
  /* 3-position theme slider (light/medium/dark), top-right - a native
     <input type=range min=0 max=2 step=1> rather than three separate
     buttons, so it reads as one continuous light-to-dark control instead
     of three unrelated toggles. */
  #theme-slider-wrap {
    position: fixed; top: 1rem; right: 1rem; z-index: 10;
    display: flex; align-items: center; gap: 0.4rem;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: 999px; padding: 0.3rem 0.7rem;
  }
  #theme-slider-wrap span { font-size: 0.9rem; line-height: 1; }
  #theme-slider { width: 4.5rem; accent-color: var(--link); cursor: pointer; margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 120px; }
  #home-character { max-width: 220px; }
  .result-item { border-bottom: 1px solid var(--border); padding: 0.5rem 0; }
  .spoiler { background: var(--fg); color: transparent; border-radius: 3px; cursor: pointer; padding: 0 0.15em; transition: none; }
  .spoiler.revealed { background: transparent; color: inherit; cursor: text; }
  .meta { color: var(--fg-muted); font-size: 0.8rem; }
  .explore-btn { margin-left: 0.5rem; font-size: 0.75rem; }
  /* Always light text, independent of theme - ATTRIBUTE_COLOR's badge
     backgrounds (set inline per-skill by skillOrPlain()) are fixed dark,
     saturated colors in both light and dark mode, not theme-tracking
     tokens - using --accent-fg here was wrong, it correctly flips to
     near-black for dark mode's button-active state, which made every
     skill badge unreadable (black text on e.g. dark blue/purple/red)
     once dark mode was on. */
  .skill-badge { color: #fff; font-weight: bold; padding: 0.05rem 0.4rem; border-radius: 3px; }
  /* Marks a span with a real hover title (actor/variable description)
     - a dotted underline so the interactivity is
     visible before hovering, not just discoverable by accident. cursor:
     help (not pointer) since it's informational, not clickable. */
  .hint { border-bottom: 1px dotted var(--fg-muted); cursor: help; }
  #hover-tooltip {
    display: none; position: fixed; z-index: 50; max-width: 320px;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); pointer-events: none;
  }
  #hover-tooltip p { margin: 0 0 0.5rem; }
  #hover-tooltip p:last-child { margin-bottom: 0; }
  /* Shared with the inline actor search-result rendering
     (actorDescriptionHtml), not just the hover tooltip - same
     {quip, tagline, body} structure, just always-visible there instead
     of on-demand. */
  .hint-quip { font-style: italic; margin-bottom: 0.3rem; }
  .hint-tagline { font-size: 0.75rem; letter-spacing: 0.02em; margin-bottom: 0.4rem; font-weight: bold; }
  .back-link { display: inline-block; margin-bottom: 0.8rem; font-size: 0.85rem; }

  .mode-tabs button { padding: 0.4rem 0.7rem; }
  .mode-tabs button.active { background: var(--accent-bg); color: var(--accent-fg); border-color: var(--accent-bg); }

  .landing-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem; min-height: 50vh;
  }
  .landing-links { display: flex; justify-content: center; gap: 1.5rem; }
  .landing-links a { display: inline-flex; align-items: center; gap: 0.4rem; }
  .landing-links svg { width: 18px; height: 18px; flex-shrink: 0; }
  .landing-contact { display: flex; justify-content: center; align-items: center; gap: 0.8rem; font-size: 0.85rem; }
  .landing-contact .sep, .meta .sep { color: var(--border); }

  #branchDescription { font-style: italic; color: var(--fg-muted); margin-top: 0.5rem; }
  #explorer, #line-detail { border: 1px solid var(--border); padding: 1rem; margin-top: 0.5rem; background: var(--bg-raised); }
  #explorer .node, #line-detail .node { margin-bottom: 1rem; }
  #explorer .speaker, #line-detail .speaker { font-weight: bold; }
  #explorer .you .speaker, #line-detail .you .speaker { color: var(--you); }
  #explorer .check, #line-detail .check, #search-results .check { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.4rem; margin: 0.3rem 0; border-radius: 3px; }
  #explorer .check.white, #line-detail .check.white, #search-results .check.white { background: var(--check-white-bg); border: 1px solid var(--check-white-border); }
  #explorer .check.red, #line-detail .check.red, #search-results .check.red { background: var(--check-red-bg); border: 1px solid var(--check-red-border); color: var(--check-red-fg); }
  .check-result { border-radius: 8px; margin-bottom: 0.6rem; padding: 0.6rem 0.8rem; border-bottom: none; }
  .check-result.white { background: var(--check-result-white-bg); border: 1px solid var(--border); }
  .check-result.red { background: var(--check-result-red-bg); border: 1px solid var(--check-result-red-border); }
  .check-result .check-skill { font-weight: bold; font-size: 1.05rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
  .check-result .check-req { font-weight: normal; font-size: 0.75rem; color: var(--fg-muted); }
  .check-result.red .check-req { color: var(--check-red-fg); }
  #explorer .passive-check, #line-detail .passive-check {
    display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.4rem; margin: 0.3rem 0;
    border-radius: 3px; background: var(--passive-bg); border: 1px solid var(--passive-border);
  }
  #explorer .text, #line-detail .text {
    margin-top: 0.3rem; white-space: pre-wrap;
    display: flex; align-items: baseline; gap: 0.5rem;
  }
  #explorer .voice-play-btn, #line-detail .voice-play-btn {
    flex-shrink: 0; border: 1px solid var(--passive-border); background: var(--passive-bg); color: var(--you);
    border-radius: 50%; width: 1.5rem; height: 1.5rem; line-height: 1;
    font-size: 0.7rem; cursor: pointer; padding: 0;
  }
  #explorer .voice-play-btn:disabled, #line-detail .voice-play-btn:disabled { opacity: 0.5; cursor: default; }
  #explorer .alts, #line-detail .alts { font-size: 0.8rem; color: var(--fg-muted); margin-top: 0.4rem; }
  #explorer .condition, #line-detail .condition {
    font-size: 0.75rem; color: var(--fg-muted); margin-top: 0.3rem;
    border-left: 3px solid var(--border-strong); padding-left: 0.5rem;
  }
  #explorer .condition code, #line-detail .condition code { color: var(--code-fg); }
  #explorer .effect, #line-detail .effect, #search-results .effect {
    font-size: 0.75rem; color: var(--fg-muted); margin-top: 0.2rem;
    border-left: 3px solid var(--effect-border); padding-left: 0.5rem;
  }
  #explorer .effect code, #line-detail .effect code, #search-results .effect code { color: var(--code-fg); }
  /* A raw userscript/condition call (e.g.
     SetVariableValue("boardwalk.pigs_espirt_morrands_from_trafic", true))
     is often one long unbroken identifier - <code> doesn't wrap by
     default, so it was overflowing straight past the node's own left
     border instead of staying inside it. Applies everywhere a raw
     script/condition string is shown, not just .effect/.condition. */
  #explorer code, #line-detail code, #search-results code {
    overflow-wrap: anywhere; word-break: break-word;
  }
  #explorer .modifiers, #line-detail .modifiers { font-size: 0.75rem; margin-top: 0.2rem; }
  #explorer .modifiers li, #line-detail .modifiers li { list-style: none; }
  #explorer .mod-pos, #line-detail .mod-pos { color: var(--success); font-weight: bold; }
  #explorer .mod-neg, #line-detail .mod-neg { color: var(--failure); font-weight: bold; }
  #explorer .mod-detail, #line-detail .mod-detail { font-size: 0.9em; opacity: 0.7; }
  #explorer .options button {
    display: flex; flex-direction: column; align-items: stretch;
    width: 100%; text-align: left; margin: 0.2rem 0; padding: 0.4rem;
    gap: 0.2rem;
  }
  #explorer .options .opt-row {
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
  }
  #explorer .options .opt-condition { font-size: 0.7rem; color: var(--fg-faint); }
  #explorer .options .opt-condition code { color: var(--fg-muted); }
  #explorer .options button.you { border-left: 3px solid var(--you); }
  #explorer .options button.cross { border-left: 3px solid var(--cross); }
  #explorer .options button.outcome-success { border-right: 5px solid var(--success); }
  #explorer .options button.outcome-failure { border-right: 5px solid var(--failure); }
  #explorer .options .outcome { font-size: 0.75rem; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
  #explorer .options .outcome.success { color: var(--success); }
  #explorer .options .outcome.failure { color: var(--failure); }
  #explorer .options .opt-id { color: var(--fg-faint); font-size: 0.75rem; }
  #explorer .options .opt-id-dup {
    color: var(--dup-fg); background: var(--dup-bg); font-weight: bold;
    padding: 0.05rem 0.3rem; border-radius: 3px;
  }
  #explorer .end { color: var(--fg-faint); font-style: italic; }
  #explorer-controls { margin-bottom: 0.5rem; }
  #explorer-controls button { margin-right: 0.4rem; }
</style>
</head>
<body>
<div id="theme-slider-wrap" title="theme: light / medium / dark">
  <span>☀</span>
  <input type="range" id="theme-slider" min="0" max="2" step="1" value="0" oninput="setTheme(Number(this.value))">
  <span>☾</span>
</div>
<div id="hover-tooltip"></div>
<div id="site-header"></div>
<h2>elysia, a Disco Elysium database crawler</h2>
<div id="version-notice" class="meta"></div>

<div id="app">

  <!-- Landing page: pick what you're looking for, then a small form for it. -->
  <div id="view-home">
    <p>what are you looking for?</p>
    <div class="toolbar mode-tabs" id="mode-tabs">
      <button data-mode="lines" onclick="setMode('lines')">a line of dialogue</button>
      <button data-mode="branches" onclick="setMode('branches')">a branch / scene</button>
      <button data-mode="line" onclick="setMode('line')">an exact line (branch/id)</button>
      <button data-mode="branch" onclick="setMode('branch')">an exact branch (id)</button>
      <button data-mode="orbs" onclick="setMode('orbs')">browse ORBs</button>
      <button data-mode="effects" onclick="setMode('effects')">an effect</button>
      <button data-mode="checks" onclick="setMode('checks')">checks</button>
      <button data-mode="actors" onclick="setMode('actors')">a character</button>
      <button data-mode="variables" onclick="setMode('variables')">a variable</button>
    </div>
    <div id="mode-form" style="margin-top: 0.6rem;"></div>
  </div>

  <!-- Shared results list for both search modes -->
  <div id="view-search" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="search-results"></div>
  </div>

  <!-- A single line's full detail - the "line page" -->
  <div id="view-line" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="line-detail"></div>
  </div>

  <!-- Changelog - static data below, listed per version -->
  <div id="view-updates" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="updates-list"></div>
  </div>

  <!-- FAQ / legal - static content, no backend involved -->
  <div id="view-faq" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="faq-list"></div>
  </div>

  <!-- The interactive branch explorer -->
  <div id="view-branch" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div class="toolbar">
      <input type="text" id="branchJumpInput" placeholder="jump to branch id, or branch/line e.g. 182/23">
      <button onclick="submitBranchJump()">go</button>
    </div>
    <div id="explorer-controls" style="display:none;">
      <button id="backBtn" onclick="goBack()">&larr; back</button>
      <button onclick="restartBranch()">&#8635; restart branch</button>
      <button onclick="copyToClipboard(branchAddressUrl(rootBranchId), this)">copy branch address</button>
      <span class="meta" id="explorerTitle"></span>
    </div>
    <div id="branchDescription" style="display:none;"></div>
    <div id="explorer"></div>
  </div>

</div>

<script type="module">
// Frontend rewrite (2026-08-28): the graph-walk core (junction-skipping,
// the passive-check exclusivity/reconvergence rule, per-field option
// merging) and graph-native "back" now live in tested, dependency-free
// modules instead of inline here - see frontend/graph.js, frontend/
// back.js, and misc/frontend-rewrite-decisions.md for the reasoning
// behind every rule. This script becomes a module (not a behavior
// change on its own) purely so it can import them with no build step.
// Relative, no leading slash - same convention every fetch() call in this
// file already uses (fetch('branches/...'), fetch('audio/...'), ...) -
// this page is reverse-proxied under a path prefix (/elysia/ in prod,
// /elysia-dev/ here), so an absolute "/frontend/..." path resolves
// against the domain root instead and 404s, silently killing the entire
// module (an import failure aborts the whole script, not just these two
// lines - explains "buttons don't work, sections missing" being
// everything at once, not just the explorer). Same class of bug already
// hit and fixed once in graph.checks.html earlier this session - missed
// applying the same fix here.
// (a bare "frontend/graph.js" specifier, no leading "./", is invalid for
// an import statement in a browser at all - unlike fetch() URLs, import
// specifiers require "./", "/", "../", or a full URL. "./" here still
// resolves relative to this document's own URL, same fix as above.)
import { indexBranch, resolveChain } from "./frontend/graph.js";
import { resolvePrevReal } from "./frontend/back.js";

// A module script's top-level `function` declarations are NOT exposed on
// `window` the way a classic script's are - but this page renders its
// buttons as HTML strings with inline onclick="foo(...)" attributes
// throughout, which need exactly that. Function declarations are hoisted
// within module scope, so referencing them here before their own
// declaration further down the file is safe.
//
// Real bug caught live (v2.1.0): "copy line/branch/ORB address"
// buttons were broken - the first pass at this list only scanned for the
// OUTERMOST call in each onclick (e.g. copyToClipboard), missing that
// lineAddressUrl/branchAddressUrl/orbAddressUrl are called *inside*
// those as nested arguments (onclick="copyToClipboard(lineAddressUrl(...),
// this)") and need exposing too. Corrected scan:
//   grep -oE 'onclick="[^"]*"|onclick='"'"'[^'"'"']*'"'"'' index.html \
//     | grep -oE '[a-zA-Z_][a-zA-Z0-9_]*\(' | sort -u
// (every identifier called anywhere inside an onclick attribute, not
// just the first one) - keep this list in sync with that, not a
// same-line-only grep, if a new onclick handler is added. One false-
// positive that scan itself surfaces, worth knowing about before trusting
// it blindly: paginationHtml's own `buildParams` parameter shows up
// inside an onclick='...${JSON.stringify(buildParams(i))}' template
// literal in the SOURCE, but that expression is evaluated away into a
// literal JSON object before the button ever exists in the real DOM -
// the identifier `buildParams` never actually appears at runtime, so it
// needs no exposure. Check whether a flagged name is genuinely still
// present in the *rendered* onclick attribute (view-source on the live
// page, not just the template) before adding it here.
window.branchAddressUrl = (...a) => branchAddressUrl(...a);
window.chooseOption = (...a) => chooseOption(...a);
window.copyToClipboard = (...a) => copyToClipboard(...a);
window.lineAddressUrl = (...a) => lineAddressUrl(...a);
window.orbAddressUrl = (...a) => orbAddressUrl(...a);
window.goBack = (...a) => goBack(...a);
window.goHome = (...a) => goHome(...a);
window.navigate = (...a) => navigate(...a);
window.playVoiceLine = (...a) => playVoiceLine(...a);
window.restartBranch = (...a) => restartBranch(...a);
window.setMode = (...a) => setMode(...a);
window.setTheme = (...a) => setTheme(...a);
window.showActorHint = (...a) => showActorHint(...a);
window.showPlainHint = (...a) => showPlainHint(...a);
window.hideHint = (...a) => hideHint(...a);
window.submitBranchJump = (...a) => submitBranchJump(...a);
window.submitBranchLookup = (...a) => submitBranchLookup(...a);
window.submitBranchSearch = (...a) => submitBranchSearch(...a);
window.submitCheckSearch = (...a) => submitCheckSearch(...a);
window.submitEffectSearch = (...a) => submitEffectSearch(...a);
window.submitLineLookup = (...a) => submitLineLookup(...a);
window.submitLinesSearch = (...a) => submitLinesSearch(...a);
window.submitOrbSearch = (...a) => submitOrbSearch(...a);
window.submitActorSearch = (...a) => submitActorSearch(...a);
window.submitVariableSearch = (...a) => submitVariableSearch(...a);

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Every response carries X-Query-Time-Ms (see main.py's add_timing_header
// middleware) - the real backend processing time, not a client-side
// estimate that would also fold in network latency. Rendered as a small
// meta line wherever a fetched result is shown.
function queryTimeHtml(res) {

}

// Wraps `name` in its attribute-colored badge if it's a skill name (as a
// check's skilltype, or as a skill speaking as an actor - both happen in
// this dataset), otherwise returns it plain-escaped.
// description (actors.description) is optional - most
// call sites (search results) don't have it available without an extra
// per-row fetch, so it's only ever passed where the caller already has
// it for free (the branch explorer/line-detail entry itself). A native
// title attribute rather than a custom tooltip widget - zero extra UI
// code, works with keyboard/no-JS, exactly matches how a browser already
// shows a link's title on hover.
// Wraps each Variable["x.y.z"] reference inside `rawText` (a condition/
// effect string - always escaped here, callers must never pre-escape it
// themselves) with a hover span showing its real description, when one
// exists. branchData.variables is embedded directly in the branch/
// line-detail response already (see main.py's
// _variable_descriptions_for_entries) - no extra fetch per hover, same
// reasoning as speaker_description. Falls back to plain escaped text for
// a reference with no known description, or a string with no reference
// at all.
function variableRefHtml(rawText) {
  if (!rawText) return "";
  const variables = (branchData && branchData.variables) || {};
  const re = /Variable\["([^"]+)"\]/g;
  let result = "";
  let lastIndex = 0;
  let m;
  while ((m = re.exec(rawText))) {
    result += escapeHtml(rawText.slice(lastIndex, m.index));
    const desc = variables[m[1]];
    const inner = escapeHtml(m[0]);
    result += desc ? `<span class="hint"${plainHintAttrs(desc)}>${inner}</span>` : inner;
    lastIndex = re.lastIndex;
  }
  result += escapeHtml(rawText.slice(lastIndex));
  return result;
}

// Rich hover tooltip - actors.description (quip/tagline/body, see
// main.py's _parse_actor_description) needs real italic/bold/paragraph
// formatting, which a native `title` attribute can't render at all
// (plain text only). One shared positioned element (#hover-tooltip)
// rather than one per hint, shown/repositioned/hidden on demand.
//
// Data travels via a data-* attribute, JSON-encoded then HTML-escaped -
// NOT interpolated directly into an inline onmouseenter="..." call. Real
// prose is full of apostrophes ("it's", "you're") that would prematurely
// close a single-quoted inline-JS string and break the page - escapeHtml
// on the JSON text is what makes this safe regardless of quote style,
// same reasoning as never building HTML via raw template-literal
// concatenation of fetched text elsewhere in this file.
function actorHintAttrs(desc) {
  if (!desc) return "";
  return ` data-actor-hint="${escapeHtml(JSON.stringify(desc))}" onmouseenter="showActorHint(this)" onmouseleave="hideHint()" onfocus="showActorHint(this)" onblur="hideHint()" tabindex="0"`;
}
function plainHintAttrs(text) {
  if (!text) return "";
  return ` data-hint="${escapeHtml(text)}" onmouseenter="showPlainHint(this)" onmouseleave="hideHint()" onfocus="showPlainHint(this)" onblur="hideHint()" tabindex="0"`;
}
function showActorHint(el) {
  let desc;
  try { desc = JSON.parse(el.dataset.actorHint); } catch (e) { return; }
  let html = "";
  if (desc.quip) html += `<div class="hint-quip"><em>${escapeHtml(desc.quip)}</em></div>`;
  if (desc.tagline) html += `<div class="hint-tagline"><strong>${escapeHtml(desc.tagline)}</strong></div>`;
  if (desc.body) html += desc.body.split("\n\n").map(p => `<p>${escapeHtml(p)}</p>`).join("");
  showTooltip(el, html);
}
function showPlainHint(el) {
  showTooltip(el, `<p>${escapeHtml(el.dataset.hint)}</p>`);
}
function showTooltip(anchorEl, html) {
  const tip = document.getElementById("hover-tooltip");
  tip.innerHTML = html;
  tip.style.display = "block";
  const rect = anchorEl.getBoundingClientRect();
  tip.style.top = (rect.bottom + 6) + "px";
  tip.style.left = rect.left + "px";
  // Clamp to the viewport only after the real size is known - flips
  // above the anchor if there's no room below, shifts left if it would
  // overflow the right edge. Both checked independently, not mutually
  // exclusive.
  const tipRect = tip.getBoundingClientRect();
  if (tipRect.right > window.innerWidth - 8) {
    tip.style.left = Math.max(8, window.innerWidth - tipRect.width - 8) + "px";
  }
  if (tipRect.bottom > window.innerHeight - 8) {
    tip.style.top = Math.max(8, rect.top - tipRect.height - 6) + "px";
  }
}
function hideHint() {
  document.getElementById("hover-tooltip").style.display = "none";
}

function skillOrPlain(name, description) {
  const hintAttrs = actorHintAttrs(description);
  const attr = SKILL_ATTRIBUTE[name];
  if (!attr) return hintAttrs ? `<span class="hint"${hintAttrs}>${escapeHtml(name)}</span>` : escapeHtml(name);
  const badgeClass = "skill-badge" + (hintAttrs ? " hint" : "");
  return `<span class="${badgeClass}"${hintAttrs} style="background:${ATTRIBUTE_COLOR[attr]}">${escapeHtml(name)}</span>`;
}

let cachedCharacters = null;
// Same shape three times over (fetch once, cache forever, populate a
// <select>'s options) - collapsed into one cache + one option-appender
// shared by all three, rather than three near-identical fetch/populate
// pairs. External call sites (populateCharacterSelect/populateEffectSelect/
// populateCheckFilters) are untouched - only the duplication behind them
// is gone.
const _cachedFetches = {};
async function cachedFetch(key, url) {
  if (!(key in _cachedFetches)) {
    const res = await fetch(url);
    _cachedFetches[key] = await res.json();
  }
  return _cachedFetches[key];
}
function appendOptions(selectEl, items, toValueLabel) {
  for (const item of items) {
    const [value, label] = toValueLabel(item);
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = label;
    selectEl.appendChild(opt);
  }
}

async function populateCharacterSelect(selectEl) {
  const chars = await cachedFetch("characters", "characters");
  appendOptions(selectEl, chars, (c) => [c.name, c.name]);
}
async function populateEffectSelect(selectEl) {
  const effects = await cachedFetch("effects", "effects");
  appendOptions(selectEl, effects, (e) => [e.name, `${e.name} (${e.count})`]);
}
async function populateCheckFilters(skillSelectEl, difficultySelectEl) {
  const meta = await cachedFetch("checksMeta", "checks/meta");
  appendOptions(skillSelectEl, meta.skills, (s) => [s, s]);
  appendOptions(difficultySelectEl, meta.difficulty_targets, (d) => [d, d]);
}

// --- router ------------------------------------------------------------
// Real query-string state (?view=...&...), so a URL from the address bar
// or a "copy address" button is an actual, reloadable/shareable link, not
// just in-memory app state. Top-level navigation (switching between
// home/search/line/branch) uses pushState so the browser back button
// works across those. Fine-grained movement *within* one branch explorer
// (choosing an option, going back inside the flattened chain) uses
// replaceState instead - the explorer's own "back" button is graph-native
// (see resolvePrevReal below), not driven by browser/session history, and
// pushing a browser-history entry per click would just fight with that.
// The address bar still always reflects the current exact position either way.

function navigate(params, push) {
  const usp = new URLSearchParams();
  for (const k in params) {
    if (params[k] !== undefined && params[k] !== null && params[k] !== "") usp.set(k, params[k]);
  }
  const qs = usp.toString();
  const url = qs ? `?${qs}` : location.pathname;
  if (push === false) history.replaceState(params, "", url);
  else history.pushState(params, "", url);
  render(params);
}

function goHome() {
  navigate({ view: "home" });
}

window.addEventListener("popstate", (e) => {
  render(e.state || Object.fromEntries(new URLSearchParams(location.search)));
});

  else if (view === "search-checks") runSearchChecks(params.type, params.skill, params.difficulty_target, Number(params.index || 0));
  else if (view === "search-actors") runSearchActors(params.q, Number(params.index || 0));
  else if (view === "search-variables") runSearchVariables(params.q, Number(params.index || 0));
  else if (view === "line") runLineDetail(params.branch, params.id);
  else if (view === "orb") runOrbDetail(params.branch);
  else if (view === "updates") renderUpdates();

}

// Theme - light/medium/dark via the top-right slider. The CSS itself
// (see <style>'s tokens) already follows the OS preference with zero JS
// needed, landing on the light or dark tier specifically (never medium -
// there's no OS-level "medium" preference to map to, it's manual-only).
// This is only for an explicit override, persisted across reloads.
// "elysia-theme" holds "light"/"medium"/"dark" once the slider's ever
// been moved, otherwise absent (follow system). The <head>'s own tiny
// inline script applies a stored override before first paint - this only
// needs to keep the slider position and live attribute in sync from here.
const THEME_TIERS = ["light", "medium", "dark"];
function currentEffectiveTheme() {
  const stored = document.documentElement.getAttribute("data-theme");
  if (stored) return stored;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function updateThemeSliderPosition() {
  const i = THEME_TIERS.indexOf(currentEffectiveTheme());
  document.getElementById("theme-slider").value = i === -1 ? 0 : i;
}
function setTheme(tierIndex) {
  const next = THEME_TIERS[tierIndex] ?? "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("elysia-theme", next); } catch (e) {}
}
updateThemeSliderPosition();
// Only matters while no explicit override is stored - keeps the slider
// (and, via the CSS media query itself, the whole page) following a live
// OS-level theme change instead of needing a reload to notice it.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  let hasOverride = false;
  try { hasOverride = !!localStorage.getItem("elysia-theme"); } catch (e) {}
  if (!hasOverride) updateThemeSliderPosition();
});

// --- search results --------------------------------------------------------

// Shared by both search views - the backend fixes page size at 100 and
// always returns {results, total, index, limit, has_more}, never a bare
// array, specifically so a result set past one page is never silently
// truncated without the caller knowing there's more.
function paginationHtml(data, buildParams) {
  if (data.total <= data.limit) return "";
  const page = Math.floor(data.index / data.limit) + 1;
  const pageCount = Math.ceil(data.total / data.limit);
  const prevIndex = Math.max(0, data.index - data.limit);
  const nextIndex = data.index + data.limit;
  const prevDisabled = data.index === 0 ? "disabled" : "";
  const nextDisabled = data.has_more ? "" : "disabled";
  return `
    <div class="toolbar" style="margin-top:0.6rem;">
      <button ${prevDisabled} onclick='navigate(${JSON.stringify(buildParams(prevIndex))})'>&larr; prev</button>
      <span class="meta">page ${page} of ${pageCount} (${data.total} total)</span>
      <button ${nextDisabled} onclick='navigate(${JSON.stringify(buildParams(nextIndex))})'>next &rarr;</button>
    </div>
  `;
}

// Shared by all 5 search types below - fetch, error-handling, the
// results-list/pagination/query-time assembly, and the loading-state
// text were previously copy-pasted 5 times (with small inconsistencies,
// e.g. "searching..." vs "loading..." depending which one you were
// reading) - collapsed here into one engine, leaving each search type to
// specify only what actually differs: its endpoint, its own param rules
// (see each spec below - "always" keys are set even when falsy, e.g.
// index=0; "optional" ones only when truthy, matching each search's own
// old `if (x) usp.set(...)` pattern), and its one render-item callback.
function buildSearchParams({ always = {}, optional = {} }) {
  const usp = new URLSearchParams();
  for (const [k, v] of Object.entries(always)) usp.set(k, v);
  for (const [k, v] of Object.entries(optional)) if (v) usp.set(k, v);
  return usp;
}

async function runSearch({ endpoint, params, viewParams, loadingText, renderItem }) {
  const out = document.getElementById("search-results");
  out.textContent = loadingText;
  try {
    const res = await fetch(`${endpoint}?${params.toString()}`);
    if (!res.ok) { out.textContent = "error: " + (await res.json()).detail; return; }
    const data = await res.json();
    const list = data.results.length ? data.results.map(renderItem).join("") : "no results.";
    out.innerHTML = list + paginationHtml(data, viewParams) + queryTimeHtml(res);
  } catch (e) {
    out.textContent = "request failed: " + e;
  }
}

// --- branch explorer -------------------------------------------------------
// /branches/{id} returns the whole branch flat (all entries + all graph
// edges) in one shot, so the actual tree-walking happens client-side:
// system/junction nodes (is_system) are transparently skipped over so the
// user only ever sees real lines and real choices, never raw plumbing nodes.

let branchData = null;
let entriesById = {};
let linksByOrigin = {};
let graphIdx = null;  // graph.js's BranchIndex - see indexBranchData(); entriesById/linksByOrigin above are kept as direct references into it, not a separate copy, so both stay in sync automatically
let currentDentryId = null;
let currentOptions = [];
let rootBranchId = null;         // the branch id "restart"/"copy branch address" use
let currentBranchId_global = null;   // branch the currently-shown choice buttons belong to
let currentAnchorBranchId = null;    // (branchId, dentryId) this render's flattened
let currentAnchorDentryId = null;    // walk actually *started* from - "back" finds
                                      // this point's real tree-predecessor, not
                                      // wherever the walk happened to stop.
const lineInfoCache = {};  // branchId:dentryId -> /lines/{id} response, reused during backward walks

// Every real (branchId, dentryId) anchor visited during the *current*
// unbroken run of "back" presses - see goBack(). The graph genuinely
// contains cycles (confirmed, not a data error - e.g. branch 1199/236
// loops back through itself), so walking backward through one forever
// returns to a node already seen without ever reaching a true root.
// Reset whenever a *forward* move happens (choosing an option, jumping to
// a branch, restarting, or loading a branch fresh) - only consecutive
// "back" presses accumulate into it.
let backTrail = new Set();

function indexBranchData(json) {
  branchData = json;
  graphIdx = indexBranch(json.branch_id, json);
  // Kept as plain references into graphIdx's own objects (not copies) -
  // every other function in this file that reads entriesById/
  // linksByOrigin directly (renderNodeHtml, renderOptions, search
  // helpers, ...) keeps working unmodified, while renderChainFrom/
  // chooseOption/goBack go through graphIdx via graph.js/back.js.
  entriesById = graphIdx.entriesById;
  linksByOrigin = graphIdx.linksByOrigin;
}

let branchQueryTimeMs = 0;  // reset per renderChainFrom call, summed across
                             // every fetch it makes - a flattened walk can
                             // cross several branches (several fetches) in
                             // one render, so only the total is meaningful.

async function fetchBranch(branchId) {
  const res = await fetch(`branches/${branchId}`);
  if (!res.ok) throw new Error((await res.json()).detail);
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  return await res.json();
}

// resolveNextOptions / mergeIdenticalOptions / commonPassThroughPrefix
// used to live here - replaced by graph.js's resolveOptions/resolveChain
// (imported above), which fixed two real bugs in this logic (badge/
// passThrough leaking across merged options with no exclusion rule, and
// a lone passive check with no sibling being silently skipped instead of
// rendered) - see misc/frontend-rewrite-decisions.md.

// Switches the loaded branchData/index to branchId, fetching if needed,
// and updates the title so it stays in sync whenever a chain walk crosses
// into a different branch mid-flow.
async function switchToBranch(branchId) {
  const json = await fetchBranch(branchId);
  indexBranchData(json);
  document.getElementById("explorerTitle").textContent = `branch ${json.branch_id}: ${json.title || ""}`;
  // dialogues.description was already shown in search-result listings, but
  // silently dropped once you actually opened the branch explorer - most
  // ORB branches (671 of 781, checked) have NO real dentries at all, their
  // entire content lives in this field, so opening one showed nothing but
  // "end of visible branch content" with zero indication why.
  const descEl = document.getElementById("branchDescription");
  descEl.textContent = json.description || "";
  descEl.style.display = json.description ? "" : "none";
}

// Shared between the full node display and the option-button preview -
// a choice leading straight into a check needs the same RED/WHITE +
// skill + difficulty badge *before* you commit to it, not just after.
function checkBadgeHtml(check) {
  // difficulty_target is the real in-game DC (6-20) - see main.py's
  // DIFFICULTY_TIERS comment for how that's derived from the raw db index.
  // The tier name (Trivial/Easy/.../Impossible) is deliberately left out -
  // it's redundant with the number and doesn't add anything.
  const label = check.difficulty_target != null
    ? `${check.difficulty_target}`
    : `tier ${check.difficulty_tier} (unrecognized)`;
  return `<div class="check ${check.is_red ? "red" : "white"}">`
       + `${check.is_red ? "RED" : "WHITE"} check &middot; ${skillOrPlain(check.skill)} &middot; ${label}`
       + `</div>`;
}

// Same idea as checkBadgeHtml but for a passive_check (a skill line gated
// by dentries.difficultypass rather than a player-picked checks row) -
// shared between the option-button preview and the full node display so
// the threshold is visible both before and after committing to it.
function passiveCheckBadgeHtml(pc) {
  const label = pc.difficulty_target != null
    ? `${pc.difficulty_target}`
    : `tier ${pc.difficulty_tier} (unrecognized)`;
  return `<div class="passive-check">passive check &middot; requires ${skillOrPlain(pc.skill)} ${label} to trigger</div>`;
}

// v2.0.0 - plays a line's voice-over, if one exists, from GET
// /audio/{branch}/{dentry} (public, same origin as everything else - see
// main.py's own comment on why a loopback-only port was dropped in favor
// of a per-IP rate limit + ban there instead). fetch() rather than a
// plain <audio src> for one reason: a <audio>/<video> element's "error"
// event carries no status code or body, so there'd be no way to tell an
// ordinary "no voice line here" 404 apart from a 429 ban and show the
// latter as an actual popup - fetch() is the only way to see which one
// came back before deciding what to do.
//
// Repeat clicks on the same line never hit this endpoint (or count
// against its rate limit) a second time - the response's own
// Cache-Control header (see get_voice_line) makes the browser's ordinary
// HTTP cache serve it straight from disk once played.
// altIndex = this alternate's own position in entry.alternates (its own
// recording, via /audio/.../alt/{i} - added this session, see
// misc/frontend-rewrite-decisions.md for the positional-match evidence)
// - omit/null for the parent line's own button (plain /audio/...).
async function playVoiceLine(branchId, dentryId, btn, altIndex) {
  btn.disabled = true;
  const reset = () => { btn.disabled = false; };
  try {
    const audioPath = altIndex == null ? `audio/${branchId}/${dentryId}` : `audio/${branchId}/${dentryId}/alt/${altIndex}`;
    const res = await fetch(audioPath);
    if (res.status === 429) {
      const body = await res.json().catch(() => ({}));
      alert(body.detail || "Too many voice-line requests - please slow down.");
      reset();
      return;
    }
    if (!res.ok) {
      reset();
      btn.title = "no voice line found for this dentry";
      return;
    }
    const blobUrl = URL.createObjectURL(await res.blob());
    const audio = new Audio(blobUrl);
    const cleanup = () => { reset(); URL.revokeObjectURL(blobUrl); };
    audio.addEventListener("ended", cleanup);
    audio.play().catch(cleanup);
  } catch (e) {
    reset();
    btn.title = "couldn't reach the server";
  }
}

function renderNodeHtml(entry, branchId, showCopyLink, extraConditions) {
  const copyLink = showCopyLink === false ? "" :
    `<button class="explore-btn" onclick="copyToClipboard(lineAddressUrl(${branchId}, ${entry.dentry_id}), this)">copy line address</button>`;
  let html = `<div class="node ${entry.is_player_choice ? "you" : ""}">`;
  html += `<div class="meta">branch ${branchId} / line ${entry.dentry_id}${copyLink}</div>`;
  html += `<div class="speaker">${skillOrPlain(entry.speaker || "?", entry.speaker_description)}</div>`;
  if (entry.condition) {
    html += `<div class="condition">shown only if <code>${variableRefHtml(entry.condition)}</code></div>`;
  }
  // Conditions gating this line weren't necessarily on the line's own
  // conditionstring - they're often on an intermediate system/junction
  // node the walk passed through (and transparently skipped) to reach it,
  // e.g. an IsTHCPresent(...) gate living on a group node above two
  // otherwise-identical Encyclopedia lines. Those got shown on the option
  // button before a click, but vanished once the option was actually
  // picked (renderChainFrom re-walks from the chosen dentry with no
  // memory of how it got there). Threading them through as extraConditions
  // keeps them visible after commit, not just before.
  if (extraConditions && extraConditions.length) {
    html += `<div class="condition">reached only if ` + extraConditions.map(c => `<code>${variableRefHtml(c)}</code>`).join(" and ") + `</div>`;
  }
  if (entry.effect) {
    html += `<div class="effect">effect: <code>${variableRefHtml(entry.effect)}</code></div>`;
  }
  // A skill "speaking" unprompted (passive_check) is identical to any other
  // entry in every other way - same speaker/text/condition/effect handling
  // above - it's only ever gated by a skill-vs-threshold roll instead of a
  // player-picked option, so it gets its own line rather than the
  // check-badge treatment (which implies something the player committed to).
  if (entry.passive_check) {
    html += passiveCheckBadgeHtml(entry.passive_check);
  }
  if (entry.check) {
    html += checkBadgeHtml(entry.check);
    if (entry.check.modifiers.length) {
      html += `<ul class="modifiers">` + entry.check.modifiers.map(m => {
        const sign = m.value >= 0 ? "+" : "";
        const cls = m.value >= 0 ? "mod-pos" : "mod-neg";
        // tooltip is just a flavor label ("Dresscode: Royalist reenactor") -
        // it doesn't restate the actual requirement, so show the raw
        // variable/CheckEquipped(...) expression alongside it too whenever
        // it differs, rather than dropping that detail on the floor.
        const detail = (m.tooltip && m.tooltip !== m.variable)
          ? ` <code class="mod-detail">${escapeHtml(m.variable)}</code>`
          : "";
        return `<li><span class="${cls}">${sign}${m.value}</span> ${escapeHtml(m.tooltip || m.variable)}${detail}</li>`;
      }).join("") + `</ul>`;
    }
  }
  // v2.0.0: a play button for the voice line, if this speaker was ever
  // voice-acted at all (has_voice_actor - see main.py's
  // VOICED_ACTOR_NAMES) - "You" and a handful of unvoiced background NPCs
  // never have one to begin with, so skip the button entirely rather than
  // show a guaranteed dead click. Even so, no per-dentry lookup ahead of
  // time - a specific line from an otherwise-voiced actor can still turn
  // out to have no audio; that click just disables briefly and sets a
  // title saying so (see playVoiceLine).
  const playBtn = entry.has_voice_actor
    ? `<button class="voice-play-btn" title="play voice line" `
      + `onclick="playVoiceLine(${branchId}, ${entry.dentry_id}, this)">&#9654;</button>`
    : "";
  html += `<div class="text">${playBtn}<span>${escapeHtml(entry.text)}</span></div>`;
  // Alternates never had a play button before (found this session) - an
  // alternate has no dentry_id of its own, so it plays its OWN recording
  // where one exists (alt = its position in this array), reusing the
  // parent's has_voice_actor gate (main.py has no cheaper way to know in
  // advance whether this *specific* alternate has a clip - same
  // best-effort-click reasoning as the parent line's own button).
  if (entry.alternates.length) {
    html += `<div class="alts"><em>alternate lines:</em><ul>`
          + entry.alternates.map((a, i) => {
              const altBtn = entry.has_voice_actor
                ? `<button class="voice-play-btn" title="play voice line" `
                  + `onclick="playVoiceLine(${branchId}, ${entry.dentry_id}, this, ${i})">&#9654;</button>`
                : "";
              return `<li>${altBtn}if <code>${variableRefHtml(a.condition)}</code>: ${escapeHtml(a.text)}</li>`;
            }).join("")
          + `</ul></div>`;
  }
  html += `</div>`;
  return html;
}

// The core of the flattening: starting at (startBranchId, startDentryId),
// keeps auto-advancing through any node that has exactly one way forward
// (see graph.js's resolveChain/resolveOptions, which now do the actual
// walking/collapsing), collecting every real line along the way -
// including lines from other branches, if the only way forward happens
// to cross into one. It only stops to show buttons once there's an
// actual choice (0 or 2+ options).
async function renderChainFrom(startBranchId, startDentryId) {
  const out = document.getElementById("explorer");
  // What "back" will find the predecessor of, next time it's pressed - see
  // goBack(). This is the walk's *start* point, not wherever it stops -
  // going back needs to reach whatever preceded this whole flattened
  // block, not one step into the middle of it.
  currentAnchorBranchId = startBranchId;
  currentAnchorDentryId = startDentryId;
  // branchQueryTimeMs is deliberately NOT reset here - it used to be, but
  // runBranchExplorer() (the entry point for any fresh branch URL) needs
  // to fetch the branch itself first, before this function even runs, to
  // validate the requested line actually exists in it. Resetting here
  // wiped out that already-real fetch time whenever this ran right after
  // it, with nothing left
  // to re-fetch to replace it - every fresh branch view was showing
  // "query took 0.0ms" no matter how expensive the actual query was
  // (confirmed on branch 980, ~250-300ms shown as 0.0). Each of this
  // function's four callers (runBranchExplorer, chooseOption, goBack,
  // restartBranch) now resets it themselves, right before whatever fetch
  // *they* are responsible for - so the counter always starts at 0 for a
  // given user action, but never after that action's own fetch already
  // happened.
  if (!branchData || branchData.branch_id !== startBranchId) {
    out.textContent = "loading...";
    try {
      await switchToBranch(startBranchId);
    } catch (e) {
      out.textContent = "failed: " + e;
      return;
    }
  }

  // The walking loop itself now lives in graph.js's resolveChain() -
  // pure, stateless, one real hop at a time, already covers everything
  // this loop used to do by hand (junction-skipping, the passive-check
  // exclusivity rule, per-field option merging, cycle guard, via content)
  // plus fixes two real bugs the old inline version had (see
  // misc/frontend-rewrite-decisions.md). A cross-branch link mid-chain
  // still needs a fresh fetch + a fresh resolveChain call on the other
  // side, since graph.js is pure/no-I/O and can't follow it on its own.
  let dentryId = startDentryId;
  let currentBranchId = startBranchId;
  const collected = [];
  const branchesSeen = new Set();  // cycle guard across resolveChain calls (a cross-branch loop)
  let finalOptions = [];

  while (true) {
    const key = currentBranchId + ":" + dentryId;
    if (branchesSeen.has(key)) { finalOptions = []; break; }
    branchesSeen.add(key);

    const chain = resolveChain(graphIdx, dentryId);
    for (const c of chain.collected) {
      const entry = entriesById[c.dentryId];
      if (entry) collected.push({ branchId: currentBranchId, entry, conditions: c.conditions });
    }

    const only = chain.options.length === 1 ? chain.options[0] : null;
    if (only && only.type === "cross") {
      try {
        await switchToBranch(only.toBranch);
      } catch (e) {
        out.textContent = "failed: " + e;
        return;
      }
      currentBranchId = only.toBranch;
      dentryId = only.toDentry;
      continue;
    }

    finalOptions = chain.options;
    dentryId = chain.collected.length ? chain.collected[chain.collected.length - 1].dentryId : dentryId;
    break;
  }

  currentDentryId = dentryId;
  currentBranchId_global = currentBranchId;
  currentOptions = finalOptions;

  const html = collected.map(({ branchId, entry, conditions }) => renderNodeHtml(entry, branchId, true, conditions)).join("")
    + renderOptions(finalOptions);
  out.innerHTML = html + `<div class="meta">query took ${branchQueryTimeMs.toFixed(1)}ms</div>`;

  // Keep the address bar reflecting where this walk *started*
  // (startBranchId/startDentryId), not wherever it happened to stop -
  // renderChainFrom is a pure deterministic function of its start point, so
  // reloading the anchor always reproduces the exact same flattened walk,
  // including any branch-crossing along the way. Writing the *end* point
  // instead (as this used to do) silently dropped the crossed-through part
  // of the path on reload: e.g. arriving at branch 489/8 by flattening
  // through from 487/27 would reload as a bare "start of 489/8", losing
  // that it was reached via 487/27 in the first place. The one case this
  // deliberately does still move the address bar is a genuine new anchor -
  // i.e. this call's own start point differs from the current URL, which
  // happens for pushState navigations (chooseOption, jump, restart) but not
  // for a same-anchor re-render.
  history.replaceState(
    { view: "branch", branch: startBranchId, at: startDentryId },
    "",
    `?view=branch&branch=${startBranchId}&at=${startDentryId}`
  );
}

// Entry point from the router: loads branchId (if not already loaded) and
// starts the flattened walk at `at` (defaults to the branch's root, 0).
async function runBranchExplorer(branch, at) {
  const out = document.getElementById("explorer");
  if (!branch) {
    out.textContent = "no branch specified.";
    return;
  }
  backTrail = new Set();  // fresh entry point, not a continuation of "back" presses
  branchQueryTimeMs = 0;  // this function's own fetch below is the start of a new timing window
  const branchId = Number(branch);
  const atGiven = at !== undefined && at !== null && at !== "";

  document.getElementById("branchJumpInput").value = "";
  document.getElementById("explorer-controls").style.display = "block";
  rootBranchId = branchId;

  if (!branchData || branchData.branch_id !== branchId) {
    branchData = null;
    out.textContent = "loading...";
    try {
      await switchToBranch(branchId);
    } catch (e) {
      out.textContent = "failed: " + e;
      return;
    }
  }
  // A handful of branches have a real narrative entry point that's a
  // check living in a *different* branch entirely (see true_entry /
  // _BRANCH_TRUE_ENTRY on the backend) - only relevant here, on a cold
  // open with no specific line pinned. Anyone arriving with an explicit
  // `at` (a search result, a copied line address, a mid-conversation
  // choice) already knows exactly where they're going and skips this.
  if (!atGiven && branchData.true_entry) {
    renderTrueEntryNotice(out, branchId, branchData.true_entry);
    return;
  }
  // Plain dentry 0 is the safe default for every other branch - the
  // forward walk already skips through its is_system HUB/"input" chain to
  // reach real content. A handful of branches used to have dentry 0
  // dead-ending in a disconnected part of the graph (see
  // _weld_disconnected_hubs in main.py's OptimizedDE.db build step) -
  // fixed at the data layer now by welding those dead ends directly to
  // the branch's real content, so 0 is reliably correct here again
  // instead of needing a runtime detour.
  const startDentry = atGiven ? Number(at) : 0;
  if (!(startDentry in entriesById)) {
    out.textContent = `line ${startDentry} not found in branch ${branchId}.`;
    return;
  }
  await renderChainFrom(branchId, startDentry);
}

// Shown instead of the normal explorer content when cold-opening (or
// restarting) a branch whose real entry point lives elsewhere - see
// runBranchExplorer's true_entry check above. Offers the real entry as
// the primary action, plus a way to see this branch's own local content
// anyway for anyone who wants to browse it directly regardless.
function renderTrueEntryNotice(out, branchId, trueEntry) {
  document.getElementById("explorer-controls").style.display = "none";
  out.innerHTML = `
    <div class="node">
      <div class="meta">branch ${branchId}</div>
      <div class="text">
        This branch's real entry point is a check in another branch -
        ${escapeHtml(trueEntry.branch_title || `branch ${trueEntry.branch_id}`)}.
      </div>
      ${trueEntry.text ? `<div class="condition">"${escapeHtml(trueEntry.text)}"</div>` : ""}
    </div>
    <div class="toolbar">
      <button onclick='navigate({view:"branch", branch:${trueEntry.branch_id}, at:${trueEntry.dentry_id}})'>go to the real entry &rarr;</button>
      <button onclick='navigate({view:"branch", branch:${branchId}, at:0})'>browse this branch's own content anyway &rarr;</button>
    </div>
  `;
}

// The in-explorer "jump" box - accepts a plain branch id ("182") to hop to
// a different branch entirely, or a branch/line pin ("182/23") to jump to
// an exact point. Goes through navigate() so it's a real, back-button-able
// top-level move (unlike clicking an option, which stays inside the
// current branch's own history stack).
function submitBranchJump() {
  const raw = document.getElementById("branchJumpInput").value.trim();
  if (!raw) return;
  const pinned = parseBranchLine(raw);
  if (pinned) {
    navigate({ view: "branch", branch: pinned.branch, at: pinned.id });
  } else if (/^\d+$/.test(raw)) {
    navigate({ view: "branch", branch: Number(raw) });
  } else {
    document.getElementById("explorer").textContent =
      "invalid input - use a branch id (182) or branch/line (182/23)";
  }
}

// A "success"/"failure" outcome (see resolveNextOptions) gets a marker on
// the right side of its button - separate from the left-side accent
// borders (you/cross), which mark a different axis (who/what kind of
// option this is, not whether it's the pass or fail path of a check).
function outcomeTag(outcome) {
  if (outcome === "success") return `<span class="outcome success">&#10003; success</span>`;
  if (outcome === "failure") return `<span class="outcome failure">&#10007; failure</span>`;
  return "";
}

function renderOptions(options) {
  if (!options.length) {
    return `<p class="end">[end of visible branch content]</p>`;
  }

  // Some branches genuinely contain two different dentries with identical
  // text (confirmed against real data, e.g. 569/6 and 569/289 - same actor,
  // no distinguishing condition/check, even the same destination; looks
  // like a Chat Mapper authoring artifact, not something to "fix"). When
  // that happens the [branch/id] tag is the only thing telling them apart,
  // so it needs to be loud enough to notice instead of blending in.
  const previewCounts = {};
  for (const o of options) {
    if (o.type === "line") {
      const e = entriesById[o.dentryId];
      const preview = e && e.text || "";
      previewCounts[preview] = (previewCounts[preview] || 0) + 1;
    }
  }

  return `<div class="options">` + options.map((o, i) => {
    const outcomeCls = o.outcome ? ` outcome-${o.outcome}` : "";
    // Never evaluated (no live game state to check against) - just surfaced
    // so a variable-gated alternative isn't presented as an unconditional
    // choice. Kept separate from the outcome tag, which already conveys
    // the check-pass/fail gate specifically.
    const condHtml = (o.conditions && o.conditions.length)
      ? `<div class="opt-condition">requires: ` + o.conditions.map(c => `<code>${variableRefHtml(c)}</code>`).join(" and ") + `</div>`
      : "";
    // Badges (real check or passive check) are shown ONLY on the actual
    // line they belong to, never previewed on an unrelated option button -
    // this is where the old app's badge-leak bug lived (mergeIdenticalOptions
    // unioning passThrough with no exclusion rule - see decisions log). A
    // passive check flattened through on the way to this option (o.via)
    // is real content the branch viewer will render (badge included) once
    // this option is actually taken - see chooseOption - just never
    // previewed here beforehand.

    if (o.type === "cross") {
      return `<button class="cross${outcomeCls}" onclick="chooseOption(${i})">`
           + `<div class="opt-row"><span>&#8618; leaves to branch ${o.toBranch}</span>${outcomeTag(o.outcome)}</div>`
           + condHtml + `</button>`;
    }
    const e = entriesById[o.dentryId];
    const preview = (e.text || "").length > 90 ? e.text.slice(0, 90) + "..." : (e.text || "");
    const cls = (e.is_player_choice ? "you" : "") + outcomeCls;
    // Who says this line matters for telling options apart at a glance -
    // previously only "you" got any speaker indication (the prefix below),
    // everyone/everything else was unlabeled.
    const speakerLabel = skillOrPlain(e.speaker || "?");
    const prefix = e.is_player_choice ? "&raquo; " : "";
    const isDuplicate = previewCounts[e.text || ""] > 1;
    // line options always land in the branch currently being walked -
    // cross options already state their own destination branch above.
    const idTag = `<span class="opt-id${isDuplicate ? " opt-id-dup" : ""}">[${currentBranchId_global}/${o.dentryId}]</span>`;
    // Committing to this option means committing to its check, if it has
    // one - that needs to be visible before the click, not just after.
    // Same goes for a passive_check (e.g. an Encyclopedia line gated on a
    // difficultypass threshold) - previously only the player-initiated
    // `check` got a badge here, so a passive-check option's threshold was
    // invisible until after it was already chosen.
    const checkHtml = e.check ? checkBadgeHtml(e.check)
      : e.passive_check ? passiveCheckBadgeHtml(e.passive_check) : "";
    return `<button class="${cls}" onclick="chooseOption(${i})">`
         + `<div class="opt-row"><span>${idTag} ${speakerLabel}: ${prefix}${escapeHtml(preview)}</span>${outcomeTag(o.outcome)}</div>`
         + checkHtml + condHtml + `</button>`;
  }).join("") + `</div>`;
}

// history stores the state right before each *shown* choice, i.e. the
// (branch, dentry) that renderChainFrom was last called with - going back
// re-walks forward from there, deterministically reproducing the same
// flattened chain + choice buttons.
async function chooseOption(i) {
  backTrail = new Set();  // a forward move breaks any "back" streak
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  const opt = currentOptions[i];
  if (opt.via && opt.via.length) {
    // A passive check flattened through on the way to this option (see
    // graph.js's resolveOptions/via) is real content that still needs
    // rendering, even though it's reached via an explicit click here -
    // anchor the NEW walk at the check's own position, not the option's
    // final destination. resolveChain is a pure function of its start
    // point, so re-walking from there naturally re-discovers the exact
    // same downstream (the check itself collected as ordinary content,
    // same as any other line, then whatever comes after it) - reload-safe,
    // no separate "render this content once, specially" path needed.
    await renderChainFrom(currentBranchId_global, opt.via[0].dentryId);
  } else if (opt.type === "cross") {
    await renderChainFrom(opt.toBranch, opt.toDentry);
  } else {
    await renderChainFrom(currentBranchId_global, opt.dentryId);
  }
}

// --- graph-native "back" ----------------------------------------------
// Deliberately NOT a replay of this session's clicks (that's what the old
// historyStack-based version did). "Back" is defined purely by the tree's
// own structure: the nearest real (non-system) predecessor of wherever
// the current flattened walk started - found via the new
// /branches/{id}/lines/{id}/predecessors endpoint, walking backward
// through system/junction nodes exactly symmetrically to how the forward
// walk skips over them. This works identically regardless of *how* the
// user arrived at the current screen - a chain of clicks, a search
// result, a pasted line address, whatever - since it never consults
// session history, only the graph itself. It can cross a branch boundary
// backward too, same as the forward walk can cross one forward, and it
// naturally bottoms out at a branch's true root (no incoming edges left),
// where it returns null and the button just does nothing further.
//
// When a node has more than one incoming edge (some genuinely do - see
// the duplicate-option findings from earlier in this project), which one
// counts as "the" predecessor is inherently ambiguous in a graph that
// isn't strictly tree-shaped. Resolved with one fixed, deterministic rule
// (lowest branch id, then lowest dentry id) rather than trying to guess
// "the" one true path - same class of tradeoff as the duplicate-option
// highlighting elsewhere in this tool.

async function fetchLineInfo(branchId, dentryId) {
  const key = `${branchId}:${dentryId}`;
  if (lineInfoCache[key]) return lineInfoCache[key];
  const res = await fetch(`branches/${branchId}/lines/${dentryId}`);
  if (!res.ok) return null;
  // "back" can make several of these calls per press (see resolvePrevReal
  // below) - previously none of that real cost was ever added to
  // branchQueryTimeMs, only fetchBranch's fetches were, so "back" could
  // do real, sometimes-multi-hop backend work and still show
  // "query took 0.0ms" because whatever ran *after* the walk (usually
  // nothing, since the target branch is normally already loaded) was the
  // only thing ever counted.
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  const data = await res.json();
  lineInfoCache[key] = data;
  return data;
}

async function fetchPredecessors(branchId, dentryId) {
  const res = await fetch(`branches/${branchId}/lines/${dentryId}/predecessors`);
  if (!res.ok) return [];
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  return await res.json();
}

// resolvePrevReal (the actual predecessor-walking algorithm) now lives in
// back.js, imported above - same algorithm as before, just parameterized
// over fetchPredecessors/fetchLineInfo (defined here, unchanged) instead
// of hardcoding them, so it can be checked against the live API without a
// DOM (see graph.checks.js). Deleted the near-duplicate copy that used to
// live here.

async function goBack() {
  const out = document.getElementById("explorer");
  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.disabled = true;
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  try {
    backTrail.add(`${currentAnchorBranchId}:${currentAnchorDentryId}`);
    const prev = await resolvePrevReal(fetchPredecessors, fetchLineInfo, currentAnchorBranchId, currentAnchorDentryId);
    if (!prev) {
      const status = document.getElementById("explorerTitle");
      const orig = status.textContent;
      status.textContent = "(already at the branch's root - nothing further back)";
      setTimeout(() => { status.textContent = orig; }, 2000);
      return;
    }
    // The graph genuinely loops in places (see backTrail's own comment) -
    // without this check, backing up through one of those cycles never
    // terminates: it keeps finding a real predecessor forever, just
    // cycling through the same handful of nodes instead of reaching a
    // root. Once "back" would return to a node this same streak of
    // presses already passed through, there's nothing new further back to
    // show, so it stops here instead of looping.
    if (backTrail.has(`${prev.branchId}:${prev.dentryId}`)) {
      const status = document.getElementById("explorerTitle");
      const orig = status.textContent;
      status.textContent = "(this branch loops back on itself here - no further unique content going back)";
      setTimeout(() => { status.textContent = orig; }, 2500);
      return;
    }
    await renderChainFrom(prev.branchId, prev.dentryId);
  } finally {
    if (backBtn) backBtn.disabled = false;
  }
}

async function restartBranch() {
  backTrail = new Set();  // a forward move breaks any "back" streak
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  // Same reasoning as runBranchExplorer's cold-open check - "restart" is
  // just as much a fresh, unconditional re-entry as a cold URL open is.
  if (branchData && branchData.branch_id === rootBranchId && branchData.true_entry) {
    renderTrueEntryNotice(document.getElementById("explorer"), rootBranchId, branchData.true_entry);
    return;
  }
  await renderChainFrom(rootBranchId, 0);
}

// --- site header + update check ----------------------------------------
// The "back to home" link only makes sense on the real arda0.net
// deployment - a self-hoster running their own copy of this repo doesn't
// want a link pointing at someone else's site, so it's only inserted
// (never just hidden via CSS, to avoid a flash-then-hide) when the page
// is actually being viewed on arda0.net.
if (location.hostname === "arda0.net") {
  document.getElementById("site-header").innerHTML =
    `<a href="https://arda0.net" class="back-link">&larr; back to home</a>`;
}

// "1.2.10" > "1.2.9" as strings would say the opposite (lexicographic, not
// numeric) - compares component-by-component instead. Returns true only if
// a is strictly greater than b; anything malformed/equal/lower is false.
function isNewerVersion(a, b) {
  const pa = a.split(".").map(Number);
  const pb = b.split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const na = pa[i] || 0, nb = pb[i] || 0;
    if (isNaN(na) || isNaN(nb)) return false;  // malformed - don't guess
    if (na !== nb) return na > nb;
  }
  return false;
}

// Compares this deployment's version.txt against the same file on the
// configured GitHub repo's main branch. Entirely client-side, entirely
// optional (config.yaml's update_check.enabled, on by default) - failure
// (offline, GitHub rate-limited, repo not published yet) is silent, this
// is a courtesy notice, not something to ever block or nag about.
async function checkForUpdate() {
  try {
    const cfg = await (await fetch("app-config")).json();
    if (!cfg.update_check_enabled) return;

    const localVersion = (await (await fetch("version.txt")).text()).trim();
    const remoteRes = await fetch(
      `https://raw.githubusercontent.com/${cfg.github_repo}/main/version.txt`
    );
    if (!remoteRes.ok) return;  // repo/file not published yet, or offline - say nothing
    const remoteVersion = (await remoteRes.text()).trim();

    // Was a plain !== check - flagged as confusing when a dev/staging box
    // runs ahead of what's actually been pushed to GitHub (its own version
    // is newer, not older, but the notice showed anyway since it was just
    // "different"). Only show it when GitHub is actually ahead.
    if (remoteVersion && isNewerVersion(remoteVersion, localVersion)) {
      document.getElementById("version-notice").innerHTML =
        `a newer version is available on `
        + `<a href="https://github.com/${cfg.github_repo}" target="_blank" rel="noopener">GitHub</a>`
        + ` (running ${escapeHtml(localVersion)}, latest is ${escapeHtml(remoteVersion)})`;
    }
  } catch (e) {
    // offline, CORS hiccup, whatever - not worth surfacing for a courtesy check
  }
}
checkForUpdate();

// --- boot -------------------------------------------------------------
render(Object.fromEntries(new URLSearchParams(location.search)));
</script>
</body>
</html>
