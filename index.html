<html lang="en">
<head>

<title>elysia - a Disco Elysium database crawler</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: monospace; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #fafafa; }
  input, select, button { font-family: monospace; font-size: 0.9rem; padding: 0.3rem; max-width: 100%; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 120px; }
  #home-character { max-width: 220px; }
  .result-item { border-bottom: 1px solid #ccc; padding: 0.5rem 0; }
  .spoiler { background: #333; color: transparent; border-radius: 3px; cursor: pointer; padding: 0 0.15em; transition: none; }
  .spoiler.revealed { background: transparent; color: inherit; cursor: text; }
  .meta { color: #666; font-size: 0.8rem; }
  .explore-btn { margin-left: 0.5rem; font-size: 0.75rem; }
  .skill-badge { color: #fff; font-weight: bold; padding: 0.05rem 0.4rem; border-radius: 3px; }
  .back-link { display: inline-block; margin-bottom: 0.8rem; font-size: 0.85rem; }

  .mode-tabs button { padding: 0.4rem 0.7rem; }
  .mode-tabs button.active { background: #333; color: #fff; }

  .landing-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem; min-height: 50vh;
  }
  .landing-links { display: flex; justify-content: center; gap: 1.5rem; }
  .landing-links a { display: inline-flex; align-items: center; gap: 0.4rem; }
  .landing-links svg { width: 18px; height: 18px; flex-shrink: 0; }
  .landing-contact { display: flex; justify-content: center; align-items: center; gap: 0.8rem; font-size: 0.85rem; }
  .landing-contact .sep { color: #ccc; }

  #branchDescription { font-style: italic; color: #666; margin-top: 0.5rem; }
  #explorer, #line-detail { border: 1px solid #ccc; padding: 1rem; margin-top: 0.5rem; }
  #explorer .node, #line-detail .node { margin-bottom: 1rem; }
  #explorer .speaker, #line-detail .speaker { font-weight: bold; }
  #explorer .you .speaker, #line-detail .you .speaker { color: #1a5fb4; }
  #explorer .check, #line-detail .check, #search-results .check { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.4rem; margin: 0.3rem 0; border-radius: 3px; }
  #explorer .check.white, #line-detail .check.white, #search-results .check.white { background: #eee; border: 1px solid #999; }
  #explorer .check.red, #line-detail .check.red, #search-results .check.red { background: #fdd; border: 1px solid #c33; color: #900; }
  .check-result { border-radius: 8px; margin-bottom: 0.6rem; padding: 0.6rem 0.8rem; border-bottom: none; }
  .check-result.white { background: #fff; border: 1px solid #ccc; }
  .check-result.red { background: #fff5f5; border: 1px solid #e3a3a3; }
  .check-result .check-skill { font-weight: bold; font-size: 1.05rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
  .check-result .check-req { font-weight: normal; font-size: 0.75rem; color: #777; }
  .check-result.red .check-req { color: #a33; }
  #explorer .passive-check, #line-detail .passive-check {
    display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.4rem; margin: 0.3rem 0;
    border-radius: 3px; background: #eef; border: 1px solid #99c;
  }
  #explorer .text, #line-detail .text { margin-top: 0.3rem; white-space: pre-wrap; }
  #explorer .alts, #line-detail .alts { font-size: 0.8rem; color: #555; margin-top: 0.4rem; }
  #explorer .condition, #line-detail .condition {
    font-size: 0.75rem; color: #555; margin-top: 0.3rem;
    border-left: 3px solid #999; padding-left: 0.5rem;
  }
  #explorer .condition code, #line-detail .condition code { color: #333; }
  #explorer .effect, #line-detail .effect {
    font-size: 0.75rem; color: #555; margin-top: 0.2rem;
    border-left: 3px solid #b58a2e; padding-left: 0.5rem;
  }
  #explorer .effect code, #line-detail .effect code { color: #333; }
  /* A raw userscript/condition call (e.g.
     SetVariableValue("boardwalk.pigs_espirt_morrands_from_trafic", true))
     is often one long unbroken identifier - <code> doesn't wrap by
     default, so it was overflowing straight past the node's own left
     border instead of staying inside it. Applies everywhere a raw
     script/condition string is shown, not just .effect/.condition. */
  #explorer code, #line-detail code, #search-results code {
    overflow-wrap: anywhere; word-break: break-word;
  }
  #explorer .modifiers, #line-detail .modifiers { font-size: 0.75rem; margin-top: 0.2rem; }

    display: flex; flex-direction: column; align-items: stretch;
    width: 100%; text-align: left; margin: 0.2rem 0; padding: 0.4rem;

  #explorer .options .outcome.failure { color: #a31212; }

<body>
<div id="site-header"></div>
<h2>elysia, a Disco Elysium database crawler</h2>
<div id="version-notice" class="meta"></div>

<div id="app">

  <!-- Landing page: pick what you're looking for, then a small form for it. -->
  <div id="view-home">
    <p>what are you looking for?</p>
    <div class="toolbar mode-tabs" id="mode-tabs">
      <button data-mode="lines" onclick="setMode('lines')">a line of dialogue</button>
      <button data-mode="branches" onclick="setMode('branches')">a branch / scene</button>
      <button data-mode="line" onclick="setMode('line')">an exact line (branch/id)</button>
      <button data-mode="branch" onclick="setMode('branch')">an exact branch (id)</button>
      <button data-mode="orbs" onclick="setMode('orbs')">browse ORBs</button>
      <button data-mode="effects" onclick="setMode('effects')">an effect</button>
      <button data-mode="checks" onclick="setMode('checks')">checks</button>
    </div>
    <div id="mode-form" style="margin-top: 0.6rem;"></div>
  </div>

  <!-- Shared results list for both search modes -->
  <div id="view-search" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="search-results"></div>
  </div>

  <!-- A single line's full detail - the "line page" -->
  <div id="view-line" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="line-detail"></div>
  </div>

  <!-- Changelog - static data below, listed per version -->
  <div id="view-updates" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div id="updates-list"></div>
  </div>

  <!-- The interactive branch explorer -->
  <div id="view-branch" style="display:none;">
    <a class="back-link" href="#" onclick="goHome(); return false;">&larr; return to main page</a>
    <div class="toolbar">
      <input type="text" id="branchJumpInput" placeholder="jump to branch id, or branch/line e.g. 182/23">
      <button onclick="submitBranchJump()">go</button>
    </div>
    <div id="explorer-controls" style="display:none;">
      <button id="backBtn" onclick="goBack()">&larr; back</button>
      <button onclick="restartBranch()">&#8635; restart branch</button>
      <button onclick="copyToClipboard(branchAddressUrl(rootBranchId), this)">copy branch address</button>
      <span class="meta" id="explorerTitle"></span>
    </div>
    <div id="branchDescription" style="display:none;"></div>
    <div id="explorer"></div>
  </div>

</div>

<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Every response carries X-Query-Time-Ms (see main.py's add_timing_header
// middleware) - the real backend processing time, not a client-side
// estimate that would also fold in network latency. Rendered as a small
// meta line wherever a fetched result is shown.
function queryTimeHtml(res) {
  const ms = res.headers.get("X-Query-Time-Ms");
  return ms != null ? `<div class="meta">query took ${escapeHtml(ms)}ms</div>` : "";
}

async function copyToClipboard(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    prompt("copy this:", text);
    return;
  }
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = "copied!";
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }
}

function lineAddressUrl(branchId, dentryId) {
  return `${location.origin}${location.pathname}?view=line&branch=${branchId}&id=${dentryId}`;
}
function branchAddressUrl(branchId) {
  return `${location.origin}${location.pathname}?view=branch&branch=${branchId}`;
}
function orbAddressUrl(branchId) {
  return `${location.origin}${location.pathname}?view=orb&branch=${branchId}`;
}

// All 24 skills, grouped by their attribute - not in the source db anywhere
// (checked: no attribute/group table, .schema has nothing for it), this is
// game knowledge layered on top. "Perception (Hearing/Sight)" are the same
// underlying skill as plain "Perception", just check-flavor variants seen
// in the checks table's skilltype column.
const SKILL_ATTRIBUTE = {
  "Logic": "INT", "Encyclopedia": "INT", "Rhetoric": "INT",
  "Drama": "INT", "Conceptualization": "INT", "Visual Calculus": "INT",
  "Volition": "PSY", "Inland Empire": "PSY", "Empathy": "PSY",
  "Authority": "PSY", "Esprit de Corps": "PSY", "Suggestion": "PSY",
  "Endurance": "PHY", "Pain Threshold": "PHY", "Physical Instrument": "PHY",
  "Electrochemistry": "PHY", "Shivers": "PHY", "Half Light": "PHY",
  "Hand/Eye Coordination": "MOT", "Perception": "MOT", "Reaction Speed": "MOT",
  "Savoir Faire": "MOT", "Interfacing": "MOT", "Composure": "MOT",
  "Perception (Hearing)": "MOT", "Perception (Sight)": "MOT",
};

const ATTRIBUTE_COLOR = {
  INT: "#1a2f6b",  // dark blue
  PSY: "#3d1a5b",  // dark purple
  PHY: "#6b1a1a",  // dark red
  MOT: "#7a6a10",  // dark yellow
};

// Wraps `name` in its attribute-colored badge if it's a skill name (as a
// check's skilltype, or as a skill speaking as an actor - both happen in
// this dataset), otherwise returns it plain-escaped.
function skillOrPlain(name) {
  const attr = SKILL_ATTRIBUTE[name];
  if (!attr) return escapeHtml(name);
  return `<span class="skill-badge" style="background:${ATTRIBUTE_COLOR[attr]}">${escapeHtml(name)}</span>`;
}

let cachedCharacters = null;
async function getCharacters() {
  if (cachedCharacters) return cachedCharacters;
  const res = await fetch("characters");
  cachedCharacters = await res.json();
  return cachedCharacters;
}
async function populateCharacterSelect(selectEl) {
  const chars = await getCharacters();
  for (const c of chars) {
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = c.name;
    selectEl.appendChild(opt);
  }
}

let cachedEffects = null;
async function getEffects() {
  if (cachedEffects) return cachedEffects;
  const res = await fetch("effects");
  cachedEffects = await res.json();
  return cachedEffects;
}
async function populateEffectSelect(selectEl) {
  const effects = await getEffects();
  for (const e of effects) {
    const opt = document.createElement("option");
    opt.value = e.name;
    opt.textContent = `${e.name} (${e.count})`;
    selectEl.appendChild(opt);
  }
}

let cachedChecksMeta = null;
async function getChecksMeta() {
  if (cachedChecksMeta) return cachedChecksMeta;
  const res = await fetch("checks/meta");
  cachedChecksMeta = await res.json();
  return cachedChecksMeta;
}
async function populateCheckFilters(skillSelectEl, difficultySelectEl) {
  const meta = await getChecksMeta();
  for (const s of meta.skills) {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    skillSelectEl.appendChild(opt);
  }
  for (const d of meta.difficulty_targets) {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    difficultySelectEl.appendChild(opt);
  }
}

// --- router ------------------------------------------------------------
// Real query-string state (?view=...&...), so a URL from the address bar
// or a "copy address" button is an actual, reloadable/shareable link, not
// just in-memory app state. Top-level navigation (switching between
// home/search/line/branch) uses pushState so the browser back button
// works across those. Fine-grained movement *within* one branch explorer
// (choosing an option, going back inside the flattened chain) uses
// replaceState instead - the explorer's own "back" button is graph-native
// (see resolvePrevReal below), not driven by browser/session history, and
// pushing a browser-history entry per click would just fight with that.
// The address bar still always reflects the current exact position either way.

function navigate(params, push) {
  const usp = new URLSearchParams();
  for (const k in params) {
    if (params[k] !== undefined && params[k] !== null && params[k] !== "") usp.set(k, params[k]);
  }
  const qs = usp.toString();
  const url = qs ? `?${qs}` : location.pathname;
  if (push === false) history.replaceState(params, "", url);
  else history.pushState(params, "", url);
  render(params);
}

function goHome() {
  navigate({ view: "home" });
}

window.addEventListener("popstate", (e) => {
  render(e.state || Object.fromEntries(new URLSearchParams(location.search)));
});

const VIEW_CONTAINERS = {
  home: "view-home",
  "search-lines": "view-search",
  "search-branches": "view-search",
  "search-orbs": "view-search",
  "search-effects": "view-search",
  "search-checks": "view-search",
  line: "view-line",
  orb: "view-line",
  updates: "view-updates",
  branch: "view-branch",
};

function showView(view) {
  const target = VIEW_CONTAINERS[view] || "view-home";
  const shown = new Set(Object.values(VIEW_CONTAINERS));
  for (const id of shown) {
    document.getElementById(id).style.display = (id === target) ? "block" : "none";
  }
}

function render(params) {
  const view = params.view || "home";
  showView(view);
  if (view === "search-lines") runSearchLines(params.q, params.character, Number(params.index || 0));
  else if (view === "search-branches") runSearchBranches(params.title, Number(params.index || 0));
  else if (view === "search-orbs") runSearchOrbs(params.q, Number(params.index || 0));
  else if (view === "search-effects") runSearchEffects(params.effect, Number(params.index || 0));
  else if (view === "search-checks") runSearchChecks(params.type, params.skill, params.difficulty_target, Number(params.index || 0));
  else if (view === "line") runLineDetail(params.branch, params.id);
  else if (view === "orb") runOrbDetail(params.branch);
  else if (view === "updates") renderUpdates();
  else if (view === "branch") runBranchExplorer(params.branch, params.at);
  else renderHome();
}

// --- home / landing ------------------------------------------------------

let currentMode = null;  // nothing pre-selected - see the two landing buttons below

// A changelog entry can mark a spoiler-y detail (e.g. naming a specific
// scene) with {{spoiler:...}} - rendered blacked-out and click-to-reveal,
// rather than just writing it plainly. Applied to the already-escaped
// text, so this can't be used to inject real markup, only to wrap a
// literal already-escaped substring in the reveal span.
function renderChangeLine(c) {
  return escapeHtml(c).replace(
    /\{\{spoiler:([^}]+)\}\}/g,
    `<span class="spoiler" onclick="this.classList.toggle('revealed')">$1</span>`
  );
}

function renderUpdates() {
  const out = document.getElementById("updates-list");
  out.innerHTML = CHANGELOG.map(rel => `
    <div class="result-item">
      <div><strong>v${escapeHtml(rel.version)}</strong></div>
      <ul>${rel.changes.map(c => `<li>${renderChangeLine(c)}</li>`).join("")}</ul>
    </div>
  `).join("");
}

function setMode(mode) {
  currentMode = mode;
  renderHome();
}

function renderHome() {
  for (const btn of document.querySelectorAll("#mode-tabs button")) {
    btn.classList.toggle("active", btn.dataset.mode === currentMode);
  }
  const el = document.getElementById("mode-form");
  if (!currentMode) {

function parseBranchLine(raw) {
  const m = raw.trim().match(/^(\d+)\s*[\/-]\s*(\d+)$/);
  return m ? { branch: Number(m[1]), id: Number(m[2]) } : null;
}

// Shared by both search views - the backend fixes page size at 100 and
// always returns {results, total, index, limit, has_more}, never a bare
// array, specifically so a result set past one page is never silently
// truncated without the caller knowing there's more.
function paginationHtml(data, buildParams) {
  if (data.total <= data.limit) return "";
  const page = Math.floor(data.index / data.limit) + 1;
  const pageCount = Math.ceil(data.total / data.limit);
  const prevIndex = Math.max(0, data.index - data.limit);
  const nextIndex = data.index + data.limit;
  const prevDisabled = data.index === 0 ? "disabled" : "";
  const nextDisabled = data.has_more ? "" : "disabled";
  return `
    <div class="toolbar" style="margin-top:0.6rem;">
      <button ${prevDisabled} onclick='navigate(${JSON.stringify(buildParams(prevIndex))})'>&larr; prev</button>
      <span class="meta">page ${page} of ${pageCount} (${data.total} total)</span>
      <button ${nextDisabled} onclick='navigate(${JSON.stringify(buildParams(nextIndex))})'>next &rarr;</button>
    </div>
  `;
}

// --- branch explorer -------------------------------------------------------
// /branches/{id} returns the whole branch flat (all entries + all graph
// edges) in one shot, so the actual tree-walking happens client-side:
// system/junction nodes (is_system) are transparently skipped over so the
// user only ever sees real lines and real choices, never raw plumbing nodes.

let branchData = null;
let entriesById = {};
let linksByOrigin = {};
let currentDentryId = null;
let currentOptions = [];
let rootBranchId = null;         // the branch id "restart"/"copy branch address" use
let currentBranchId_global = null;   // branch the currently-shown choice buttons belong to
let currentAnchorBranchId = null;    // (branchId, dentryId) this render's flattened
let currentAnchorDentryId = null;    // walk actually *started* from - "back" finds
                                      // this point's real tree-predecessor, not
                                      // wherever the walk happened to stop.
const lineInfoCache = {};  // branchId:dentryId -> /lines/{id} response, reused during backward walks

// Every real (branchId, dentryId) anchor visited during the *current*
// unbroken run of "back" presses - see goBack(). The graph genuinely
// contains cycles (confirmed, not a data error - e.g. branch 1199/236
// loops back through itself), so walking backward through one forever
// returns to a node already seen without ever reaching a true root.
// Reset whenever a *forward* move happens (choosing an option, jumping to
// a branch, restarting, or loading a branch fresh) - only consecutive
// "back" presses accumulate into it.
let backTrail = new Set();

function indexBranchData(json) {
  branchData = json;
  entriesById = {};
  linksByOrigin = {};
  for (const e of json.entries) entriesById[e.dentry_id] = e;
  for (const l of json.links) {
    (linksByOrigin[l.from_dentry_id] ||= []).push(l);
  }
}

let branchQueryTimeMs = 0;  // reset per renderChainFrom call, summed across
                             // every fetch it makes - a flattened walk can
                             // cross several branches (several fetches) in
                             // one render, so only the total is meaningful.

async function fetchBranch(branchId) {
  const res = await fetch(`branches/${branchId}`);
  if (!res.ok) throw new Error((await res.json()).detail);
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  return await res.json();
}

// Walks forward from dentryId, transparently skipping system/junction
// nodes, and returns the list of reachable "real" next steps - either a
// real line/choice in this branch, or a marker that the tree leaves to a
// different branch entirely. visited guards against cycles (the graph is
// not guaranteed to be acyclic).
// activeFlag is the flagname of the check the caller is currently past (if
// any) - a check's pass/fail branches are encoded in this dataset as two
// system/group nodes further down the graph, gated by conditionstring
// Variable["<flag>"] (success) or (Variable["<flag>"]) == false (failure).
// Confirmed against the real data (checks.flagname cross-referenced with
// dentries.conditionstring) rather than assumed. Every option inherits the
// outcome of whichever gate it passed through, if any.
// conditions accumulates any *other* (non-outcome) gating conditions seen
// on system/group nodes passed through on the way to this option - the
// tool never evaluates these (no live game state to check them against),
// it just surfaces them so alternatives-by-variable are visibly labeled
// instead of silently presented as if they were unconditional choices.
function resolveNextOptions(dentryId, activeFlag, visited, outcome, conditions, passThrough) {
  visited = visited || new Set();
  conditions = conditions || [];
  passThrough = passThrough || [];
  const options = [];
  const links = linksByOrigin[dentryId] || [];
  for (const l of links) {
    if (l.leaves_branch) {
      options.push({ type: "cross", toBranch: l.to_branch_id, toDentry: l.to_dentry_id, outcome: outcome || null, conditions, passThrough });
      continue;
    }
    if (visited.has(l.to_dentry_id)) continue;
    const dest = entriesById[l.to_dentry_id];
    if (!dest) continue;
    if (dest.is_system) {
      let nextOutcome = outcome || null;
      let nextConditions = conditions;
      if (dest.condition) {
        if (activeFlag && dest.condition === `Variable["${activeFlag}"]`) {
          nextOutcome = "success";
        } else if (activeFlag && dest.condition === `(Variable["${activeFlag}"]) == false`) {
          nextOutcome = "failure";
        } else {
          // a generic gate, not the specific check-outcome pattern above -
          // record it rather than silently passing through.
          nextConditions = [...conditions, dest.condition];
        }
      }
      const nextVisited = new Set(visited);
      nextVisited.add(l.to_dentry_id);
      options.push(...resolveNextOptions(l.to_dentry_id, activeFlag, nextVisited, nextOutcome, nextConditions, passThrough));
    } else if (dest.passive_check) {
      // A skill "speaking" unprompted is never a real dialogue choice - it
      // fires (or doesn't) purely based on state, exactly like a system
      // junction's gate, not something the player picked between. Walking
      // straight through it instead of stopping here never actually loses
      // a distinct path - arda, 2026-08-26: "passive checks are never a
      // dialogue option ... a fork defeats that purpose for passive checks
      // that doesn't even lose us paths to display." The line is still
      // real content though, so it rides along in passThrough and gets
      // rendered (via the normal single-hop auto-advance) once the walk
      // actually reaches it.
      const nextVisited = new Set(visited);
      nextVisited.add(l.to_dentry_id);
      const lineConditions = dest.condition ? [...conditions, dest.condition] : conditions;
      const nextPassThrough = [...passThrough, { dentryId: l.to_dentry_id, conditions: lineConditions }];
      options.push(...resolveNextOptions(l.to_dentry_id, activeFlag, nextVisited, outcome, [], nextPassThrough));
    } else {
      // The destination line can carry its own gating condition directly
      // (not just via an intermediate system junction) - e.g. two options
      // with identical preview text that are actually a before/after-quest
      // variant pair, distinguished only by their own conditionstring.
      // Missing this made such pairs look like unexplained duplicates.
      const lineConditions = dest.condition ? [...conditions, dest.condition] : conditions;
      options.push({ type: "line", dentryId: l.to_dentry_id, outcome: outcome || null, conditions: lineConditions, passThrough });
    }
  }
  return mergeIdenticalOptions(options);
}

// A fork whose branches only differ in whether a passive check fired along
// the way (see the dest.passive_check case above) still produces two
// distinct option entries pointing at the exact same real destination -
// walking through the check or skipping it both land the player on the
// same next content. That's not two paths, it's one path described two
// ways, so merge them into a single option instead of stopping to ask
// which one to click. Reached-unconditionally wins over any leftover
// condition (if even one merged path needed no gate, the destination as a
// whole needs no gate either - the other path's condition just describes
// one specific way in, not a restriction on all of them).
function mergeIdenticalOptions(options) {
  const groups = new Map();
  const order = [];
  for (const o of options) {
    const key = o.type === "cross" ? `cross:${o.toBranch}:${o.toDentry}` : `line:${o.dentryId}`;
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(o);
  }
  const merged = [];
  for (const key of order) {
    const group = groups.get(key);
    if (group.length === 1) { merged.push(group[0]); continue; }
    const anyUnconditional = group.some(o => !o.conditions || o.conditions.length === 0);
    const conditions = anyUnconditional ? [] : group[0].conditions;
    const seenPt = new Set();
    const passThrough = [];
    for (const o of group) for (const pt of (o.passThrough || [])) {
      if (!seenPt.has(pt.dentryId)) { seenPt.add(pt.dentryId); passThrough.push(pt); }
    }
    const withOutcome = group.find(o => o.outcome);
    merged.push({ ...group[0], conditions, passThrough, outcome: withOutcome ? withOutcome.outcome : null });
  }
  return merged;
  return options;
}

// A passive-check chain doesn't always fully collapse a fork away (see
// mergeIdenticalOptions) - sometimes it leads into a REAL multi-way fork,
// where every option still carries the exact same passThrough prefix (the
// same checks, walked once, before the graph actually branches). That
// shared prefix is real content that needs rendering once, exactly like
// the already-handled case of a passThrough collapsing to a single option
// - it's just reached via renderChainFrom's while-loop breaking (a genuine
// fork) instead of continuing (a full collapse). Returns the shared
// prefix, or [] if there isn't one - either no option has any passThrough
// at all, or they disagree (e.g. two independent passive checks forking
// in parallel rather than one chain feeding a single downstream fork) -
// that disagreement case is left alone rather than guessed at.
function commonPassThroughPrefix(opts) {
  if (!opts.length) return [];
  const first = opts[0].passThrough || [];
  if (!first.length) return [];
  for (const o of opts) {
    const pt = o.passThrough || [];
    if (pt.length !== first.length) return [];
    for (let i = 0; i < first.length; i++) {
      if (pt[i].dentryId !== first[i].dentryId) return [];
    }
  }
  return first;
}

// Switches the loaded branchData/index to branchId, fetching if needed,
// and updates the title so it stays in sync whenever a chain walk crosses
// into a different branch mid-flow.
async function switchToBranch(branchId) {
  const json = await fetchBranch(branchId);
  indexBranchData(json);
  document.getElementById("explorerTitle").textContent = `branch ${json.branch_id}: ${json.title || ""}`;
  // dialogues.description was already shown in search-result listings, but
  // silently dropped once you actually opened the branch explorer - most
  // ORB branches (671 of 781, checked) have NO real dentries at all, their
  // entire content lives in this field, so opening one showed nothing but
  // "end of visible branch content" with zero indication why.
  const descEl = document.getElementById("branchDescription");
  descEl.textContent = json.description || "";
  descEl.style.display = json.description ? "" : "none";
}

// Shared between the full node display and the option-button preview -
// a choice leading straight into a check needs the same RED/WHITE +
// skill + difficulty badge *before* you commit to it, not just after.
function checkBadgeHtml(check) {
  // difficulty_target is the real in-game DC (6-20) - see main.py's
  // DIFFICULTY_TIERS comment for how that's derived from the raw db index.
  // The tier name (Trivial/Easy/.../Impossible) is deliberately left out -
  // it's redundant with the number and doesn't add anything.
  const label = check.difficulty_target != null
    ? `${check.difficulty_target}`
    : `tier ${check.difficulty_tier} (unrecognized)`;
  return `<div class="check ${check.is_red ? "red" : "white"}">`
       + `${check.is_red ? "RED" : "WHITE"} check &middot; ${skillOrPlain(check.skill)} &middot; ${label}`
       + `</div>`;
}

// Same idea as checkBadgeHtml but for a passive_check (a skill line gated
// by dentries.difficultypass rather than a player-picked checks row) -
// shared between the option-button preview and the full node display so
// the threshold is visible both before and after committing to it.
function passiveCheckBadgeHtml(pc) {
  const label = pc.difficulty_target != null
    ? `${pc.difficulty_target}`
    : `tier ${pc.difficulty_tier} (unrecognized)`;
  return `<div class="passive-check">passive check &middot; requires ${skillOrPlain(pc.skill)} ${label} to trigger</div>`;
}

function renderNodeHtml(entry, branchId, showCopyLink, extraConditions) {
  const copyLink = showCopyLink === false ? "" :
    `<button class="explore-btn" onclick="copyToClipboard(lineAddressUrl(${branchId}, ${entry.dentry_id}), this)">copy line address</button>`;
  let html = `<div class="node ${entry.is_player_choice ? "you" : ""}">`;
  html += `<div class="meta">branch ${branchId} / line ${entry.dentry_id}${copyLink}</div>`;
  html += `<div class="speaker">${skillOrPlain(entry.speaker || "?")}</div>`;
  if (entry.condition) {
    html += `<div class="condition">shown only if <code>${escapeHtml(entry.condition)}</code></div>`;
  }
  // Conditions gating this line weren't necessarily on the line's own
  // conditionstring - they're often on an intermediate system/junction
  // node the walk passed through (and transparently skipped) to reach it,
  // e.g. an IsTHCPresent(...) gate living on a group node above two
  // otherwise-identical Encyclopedia lines. Those got shown on the option
  // button before a click, but vanished once the option was actually
  // picked (renderChainFrom re-walks from the chosen dentry with no
  // memory of how it got there). Threading them through as extraConditions
  // keeps them visible after commit, not just before.
  if (extraConditions && extraConditions.length) {
    html += `<div class="condition">reached only if ` + extraConditions.map(c => `<code>${escapeHtml(c)}</code>`).join(" and ") + `</div>`;
  }
  if (entry.effect) {
    html += `<div class="effect">effect: <code>${escapeHtml(entry.effect)}</code></div>`;
  }
  // A skill "speaking" unprompted (passive_check) is identical to any other
  // entry in every other way - same speaker/text/condition/effect handling
  // above - it's only ever gated by a skill-vs-threshold roll instead of a
  // player-picked option, so it gets its own line rather than the
  // check-badge treatment (which implies something the player committed to).
  if (entry.passive_check) {
    html += passiveCheckBadgeHtml(entry.passive_check);
  }
  if (entry.check) {
    html += checkBadgeHtml(entry.check);
    if (entry.check.modifiers.length) {
      html += `<ul class="modifiers">` + entry.check.modifiers.map(m => {
        const sign = m.value >= 0 ? "+" : "";
        const cls = m.value >= 0 ? "mod-pos" : "mod-neg";
        // tooltip is just a flavor label ("Dresscode: Royalist reenactor") -
        // it doesn't restate the actual requirement, so show the raw
        // variable/CheckEquipped(...) expression alongside it too whenever
        // it differs, rather than dropping that detail on the floor.
        const detail = (m.tooltip && m.tooltip !== m.variable)
          ? ` <code class="mod-detail">${escapeHtml(m.variable)}</code>`
          : "";
        return `<li><span class="${cls}">${sign}${m.value}</span> ${escapeHtml(m.tooltip || m.variable)}${detail}</li>`;
      }).join("") + `</ul>`;
    }
  }
  html += `<div class="text">${escapeHtml(entry.text)}</div>`;
  if (entry.alternates.length) {
    html += `<div class="alts"><em>alternate lines:</em><ul>`
          + entry.alternates.map(a => `<li>if <code>${escapeHtml(a.condition)}</code>: ${escapeHtml(a.text)}</li>`).join("")
          + `</ul></div>`;
  }
  html += `</div>`;
  return html;
}

// The core of the flattening: starting at (startBranchId, startDentryId),
// keeps auto-advancing through any node that has exactly one way forward
// (whether that's a plain single link or a system-junction chain that
// resolveNextOptions() already collapsed to one real option), collecting
// every real line along the way - including lines from other branches, if
// the only way forward happens to cross into one. It only stops to show
// buttons once there's an actual choice (0 or 2+ options).
async function renderChainFrom(startBranchId, startDentryId) {
  const out = document.getElementById("explorer");
  // What "back" will find the predecessor of, next time it's pressed - see
  // goBack(). This is the walk's *start* point, not wherever it stops -
  // going back needs to reach whatever preceded this whole flattened
  // block, not one step into the middle of it.
  currentAnchorBranchId = startBranchId;
  currentAnchorDentryId = startDentryId;
  // branchQueryTimeMs is deliberately NOT reset here - it used to be, but
  // runBranchExplorer() (the entry point for any fresh branch URL) needs
  // to fetch the branch itself first, before this function even runs, to
  // validate the requested line actually exists in it. Resetting here
  // wiped out that already-real fetch time whenever this ran right after
  // it, with nothing left
  // to re-fetch to replace it - every fresh branch view was showing
  // "query took 0.0ms" no matter how expensive the actual query was
  // (confirmed on branch 980, ~250-300ms shown as 0.0). Each of this
  // function's four callers (runBranchExplorer, chooseOption, goBack,
  // restartBranch) now resets it themselves, right before whatever fetch
  // *they* are responsible for - so the counter always starts at 0 for a
  // given user action, but never after that action's own fetch already
  // happened.
  if (!branchData || branchData.branch_id !== startBranchId) {
    out.textContent = "loading...";
    try {
      await switchToBranch(startBranchId);
    } catch (e) {
      out.textContent = "failed: " + e;
      return;
    }
  }

  let dentryId = startDentryId;
  let currentBranchId = startBranchId;
  const collected = [];
  const visited = new Set();
  let finalOptions = [];
  let activeCheckFlag = null;  // sticks until the next real check overwrites it
  // Conditions on system/junction nodes the walk is about to pass through
  // to reach the *next* collected entry - resolveNextOptions already
  // accumulates these while skipping is_system nodes internally, but the
  // old loop only ever used `only.dentryId`/`only.toDentry`, throwing the
  // accumulated conditions away. Carried forward here so the entry they
  // gated can still show them once rendered.
  let pendingConditions = [];

  while (true) {
    const key = currentBranchId + ":" + dentryId;
    if (visited.has(key)) { finalOptions = []; break; }  // cycle guard - stop rather than loop forever
    visited.add(key);

    const entry = entriesById[dentryId];
    if (entry && !entry.is_system) {
      collected.push({ branchId: currentBranchId, entry, conditions: pendingConditions });
      pendingConditions = [];
      if (entry.check) activeCheckFlag = entry.check.flag;
    }

    const opts = resolveNextOptions(dentryId, activeCheckFlag);
    if (opts.length !== 1) {
      // A genuine fork (or dead end) - stop here. But first, if every
      // option shares the same passive-check prefix (see
      // commonPassThroughPrefix), that prefix is real content that was
      // never actually stopped at on its own - render it now, in order,
      // instead of leaving it to bleed into the option buttons below (see
      // renderOptions' passThroughHtml, which is now just a fallback for
      // the disagreeing-prefix case this can't resolve).
      const prefix = commonPassThroughPrefix(opts);
      for (const pt of prefix) {
        const ptEntry = entriesById[pt.dentryId];
        if (ptEntry) collected.push({ branchId: currentBranchId, entry: ptEntry, conditions: pt.conditions || [] });
      }
      finalOptions = prefix.length ? opts.map(o => ({ ...o, passThrough: [] })) : opts;
      break;
    }

    const only = opts[0];
    // If a passive check was transparently walked through to reach this
    // option (see resolveNextOptions), step into it first instead of
    // jumping straight to the option's own target - it's real content
    // that still needs rendering, it's just never a stop-and-click point.
    // Re-resolving from there naturally rediscovers whatever comes after
    // it (including the original option, or a further passive check, or
    // a genuine fork), the same as any other single-hop node.
    if (only.passThrough && only.passThrough.length) {
      const first = only.passThrough[0];
      pendingConditions = first.conditions || [];
      dentryId = first.dentryId;
    } else {
      pendingConditions = only.conditions || [];
      if (only.type === "cross") {
        try {
          await switchToBranch(only.toBranch);
        } catch (e) {
          out.textContent = "failed: " + e;
          return;
        }
        currentBranchId = only.toBranch;
        dentryId = only.toDentry;
      } else {
        dentryId = only.dentryId;
      }
    }
  }

  currentDentryId = dentryId;
  currentBranchId_global = currentBranchId;
  currentOptions = finalOptions;

  const html = collected.map(({ branchId, entry, conditions }) => renderNodeHtml(entry, branchId, true, conditions)).join("")
    + renderOptions(finalOptions);
  out.innerHTML = html + `<div class="meta">query took ${branchQueryTimeMs.toFixed(1)}ms</div>`;

  // Keep the address bar reflecting where this walk *started*
  // (startBranchId/startDentryId), not wherever it happened to stop -
  // renderChainFrom is a pure deterministic function of its start point, so
  // reloading the anchor always reproduces the exact same flattened walk,
  // including any branch-crossing along the way. Writing the *end* point
  // instead (as this used to do) silently dropped the crossed-through part
  // of the path on reload: e.g. arriving at branch 489/8 by flattening
  // through from 487/27 would reload as a bare "start of 489/8", losing
  // that it was reached via 487/27 in the first place. The one case this
  // deliberately does still move the address bar is a genuine new anchor -
  // i.e. this call's own start point differs from the current URL, which
  // happens for pushState navigations (chooseOption, jump, restart) but not
  // for a same-anchor re-render.
  history.replaceState(
    { view: "branch", branch: startBranchId, at: startDentryId },
    "",
    `?view=branch&branch=${startBranchId}&at=${startDentryId}`
  );
}

// Entry point from the router: loads branchId (if not already loaded) and
// starts the flattened walk at `at` (defaults to the branch's root, 0).
async function runBranchExplorer(branch, at) {
  const out = document.getElementById("explorer");
  if (!branch) {
    out.textContent = "no branch specified.";
    return;
  }
  backTrail = new Set();  // fresh entry point, not a continuation of "back" presses
  branchQueryTimeMs = 0;  // this function's own fetch below is the start of a new timing window
  const branchId = Number(branch);
  const atGiven = at !== undefined && at !== null && at !== "";

  document.getElementById("branchJumpInput").value = "";
  document.getElementById("explorer-controls").style.display = "block";
  rootBranchId = branchId;

  if (!branchData || branchData.branch_id !== branchId) {
    branchData = null;
    out.textContent = "loading...";
    try {
      await switchToBranch(branchId);
    } catch (e) {
      out.textContent = "failed: " + e;
      return;
    }
  }
  // A handful of branches have a real narrative entry point that's a
  // check living in a *different* branch entirely (see true_entry /
  // _BRANCH_TRUE_ENTRY on the backend) - only relevant here, on a cold
  // open with no specific line pinned. Anyone arriving with an explicit
  // `at` (a search result, a copied line address, a mid-conversation
  // choice) already knows exactly where they're going and skips this.
  if (!atGiven && branchData.true_entry) {
    renderTrueEntryNotice(out, branchId, branchData.true_entry);
    return;
  }
  // Plain dentry 0 is the safe default for every other branch - the
  // forward walk already skips through its is_system HUB/"input" chain to
  // reach real content. A handful of branches used to have dentry 0
  // dead-ending in a disconnected part of the graph (see
  // _weld_disconnected_hubs in main.py's OptimizedDE.db build step) -
  // fixed at the data layer now by welding those dead ends directly to
  // the branch's real content, so 0 is reliably correct here again
  // instead of needing a runtime detour.
  const startDentry = atGiven ? Number(at) : 0;
  if (!(startDentry in entriesById)) {
    out.textContent = `line ${startDentry} not found in branch ${branchId}.`;
    return;
  }
  await renderChainFrom(branchId, startDentry);
}

// Shown instead of the normal explorer content when cold-opening (or
// restarting) a branch whose real entry point lives elsewhere - see
// runBranchExplorer's true_entry check above. Offers the real entry as
// the primary action, plus a way to see this branch's own local content
// anyway for anyone who wants to browse it directly regardless.
function renderTrueEntryNotice(out, branchId, trueEntry) {
  document.getElementById("explorer-controls").style.display = "none";
  out.innerHTML = `
    <div class="node">
      <div class="meta">branch ${branchId}</div>
      <div class="text">
        This branch's real entry point is a check in another branch -
        ${escapeHtml(trueEntry.branch_title || `branch ${trueEntry.branch_id}`)}.
      </div>
      ${trueEntry.text ? `<div class="condition">"${escapeHtml(trueEntry.text)}"</div>` : ""}
    </div>
    <div class="toolbar">
      <button onclick='navigate({view:"branch", branch:${trueEntry.branch_id}, at:${trueEntry.dentry_id}})'>go to the real entry &rarr;</button>
      <button onclick='navigate({view:"branch", branch:${branchId}, at:0})'>browse this branch's own content anyway &rarr;</button>
    </div>
  `;
}

// The in-explorer "jump" box - accepts a plain branch id ("182") to hop to
// a different branch entirely, or a branch/line pin ("182/23") to jump to
// an exact point. Goes through navigate() so it's a real, back-button-able
// top-level move (unlike clicking an option, which stays inside the
// current branch's own history stack).
function submitBranchJump() {
  const raw = document.getElementById("branchJumpInput").value.trim();
  if (!raw) return;
  const pinned = parseBranchLine(raw);
  if (pinned) {
    navigate({ view: "branch", branch: pinned.branch, at: pinned.id });
  } else if (/^\d+$/.test(raw)) {
    navigate({ view: "branch", branch: Number(raw) });
  } else {
    document.getElementById("explorer").textContent =
      "invalid input - use a branch id (182) or branch/line (182/23)";
  }
}

// A "success"/"failure" outcome (see resolveNextOptions) gets a marker on
// the right side of its button - separate from the left-side accent
// borders (you/cross), which mark a different axis (who/what kind of
// option this is, not whether it's the pass or fail path of a check).
function outcomeTag(outcome) {
  if (outcome === "success") return `<span class="outcome success">&#10003; success</span>`;
  if (outcome === "failure") return `<span class="outcome failure">&#10007; failure</span>`;
  return "";
}

function renderOptions(options) {
  if (!options.length) {
    return `<p class="end">[end of visible branch content]</p>`;
  }

  // Some branches genuinely contain two different dentries with identical
  // text (confirmed against real data, e.g. 569/6 and 569/289 - same actor,
  // no distinguishing condition/check, even the same destination; looks
  // like a Chat Mapper authoring artifact, not something to "fix"). When
  // that happens the [branch/id] tag is the only thing telling them apart,
  // so it needs to be loud enough to notice instead of blending in.
  const previewCounts = {};
  for (const o of options) {
    if (o.type === "line") {
      const e = entriesById[o.dentryId];
      const preview = e && e.text || "";
      previewCounts[preview] = (previewCounts[preview] || 0) + 1;
    }
  }

  return `<div class="options">` + options.map((o, i) => {
    const outcomeCls = o.outcome ? ` outcome-${o.outcome}` : "";
    // Never evaluated (no live game state to check against) - just surfaced
    // so a variable-gated alternative isn't presented as an unconditional
    // choice. Kept separate from the outcome tag, which already conveys
    // the check-pass/fail gate specifically.
    const condHtml = (o.conditions && o.conditions.length)
      ? `<div class="opt-condition">requires: ` + o.conditions.map(c => `<code>${escapeHtml(c)}</code>`).join(" and ") + `</div>`
      : "";
    // A passive check reached on the way to this option no longer stops
    // the walk on its own (see resolveNextOptions), but if this option is
    // still a real fork for some other reason, its badge would otherwise
    // vanish entirely - it's now several hops behind o.dentryId, not
    // o.dentryId itself. Preview it here instead, in the order it's
    // actually encountered.
    const passThroughHtml = (o.passThrough || []).map(pt => {
      const ptEntry = entriesById[pt.dentryId];
      return ptEntry && ptEntry.passive_check ? passiveCheckBadgeHtml(ptEntry.passive_check) : "";
    }).join("");

    if (o.type === "cross") {
      return `<button class="cross${outcomeCls}" onclick="chooseOption(${i})">`
           + `<div class="opt-row"><span>&#8618; leaves to branch ${o.toBranch}</span>${outcomeTag(o.outcome)}</div>`
           + passThroughHtml + condHtml + `</button>`;
    }
    const e = entriesById[o.dentryId];
    const preview = (e.text || "").length > 90 ? e.text.slice(0, 90) + "..." : (e.text || "");
    const cls = (e.is_player_choice ? "you" : "") + outcomeCls;
    // Who says this line matters for telling options apart at a glance -
    // previously only "you" got any speaker indication (the prefix below),
    // everyone/everything else was unlabeled.
    const speakerLabel = skillOrPlain(e.speaker || "?");
    const prefix = e.is_player_choice ? "&raquo; " : "";
    const isDuplicate = previewCounts[e.text || ""] > 1;
    // line options always land in the branch currently being walked -
    // cross options already state their own destination branch above.
    const idTag = `<span class="opt-id${isDuplicate ? " opt-id-dup" : ""}">[${currentBranchId_global}/${o.dentryId}]</span>`;
    // Committing to this option means committing to its check, if it has
    // one - that needs to be visible before the click, not just after.
    // Same goes for a passive_check (e.g. an Encyclopedia line gated on a
    // difficultypass threshold) - previously only the player-initiated
    // `check` got a badge here, so a passive-check option's threshold was
    // invisible until after it was already chosen.
    const checkHtml = e.check ? checkBadgeHtml(e.check)
      : e.passive_check ? passiveCheckBadgeHtml(e.passive_check) : "";
    return `<button class="${cls}" onclick="chooseOption(${i})">`
         + `<div class="opt-row"><span>${idTag} ${speakerLabel}: ${prefix}${escapeHtml(preview)}</span>${outcomeTag(o.outcome)}</div>`
         + passThroughHtml + checkHtml + condHtml + `</button>`;
  }).join("") + `</div>`;
}

// history stores the state right before each *shown* choice, i.e. the
// (branch, dentry) that renderChainFrom was last called with - going back
// re-walks forward from there, deterministically reproducing the same
// flattened chain + choice buttons.
async function chooseOption(i) {
  backTrail = new Set();  // a forward move breaks any "back" streak
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  const opt = currentOptions[i];
  if (opt.passThrough && opt.passThrough.length) {
    // Same reasoning as the auto-advance loop in renderChainFrom - a
    // passive check hanging off this option (which can still happen when
    // it doesn't fully collapse the fork away) gets walked into first,
    // not skipped, even though it's reached via an explicit click here.
    await renderChainFrom(currentBranchId_global, opt.passThrough[0].dentryId);
  } else if (opt.type === "cross") {
    await renderChainFrom(opt.toBranch, opt.toDentry);
  } else {
    await renderChainFrom(currentBranchId_global, opt.dentryId);
  }
}

// --- graph-native "back" ----------------------------------------------
// Deliberately NOT a replay of this session's clicks (that's what the old
// historyStack-based version did). "Back" is defined purely by the tree's
// own structure: the nearest real (non-system) predecessor of wherever
// the current flattened walk started - found via the new
// /branches/{id}/lines/{id}/predecessors endpoint, walking backward
// through system/junction nodes exactly symmetrically to how the forward
// walk skips over them. This works identically regardless of *how* the
// user arrived at the current screen - a chain of clicks, a search
// result, a pasted line address, whatever - since it never consults
// session history, only the graph itself. It can cross a branch boundary
// backward too, same as the forward walk can cross one forward, and it
// naturally bottoms out at a branch's true root (no incoming edges left),
// where it returns null and the button just does nothing further.
//
// When a node has more than one incoming edge (some genuinely do - see
// the duplicate-option findings from earlier in this project), which one
// counts as "the" predecessor is inherently ambiguous in a graph that
// isn't strictly tree-shaped. Resolved with one fixed, deterministic rule
// (lowest branch id, then lowest dentry id) rather than trying to guess
// "the" one true path - same class of tradeoff as the duplicate-option
// highlighting elsewhere in this tool.

async function fetchLineInfo(branchId, dentryId) {
  const key = `${branchId}:${dentryId}`;
  if (lineInfoCache[key]) return lineInfoCache[key];
  const res = await fetch(`branches/${branchId}/lines/${dentryId}`);
  if (!res.ok) return null;
  // "back" can make several of these calls per press (see resolvePrevReal
  // below) - previously none of that real cost was ever added to
  // branchQueryTimeMs, only fetchBranch's fetches were, so "back" could
  // do real, sometimes-multi-hop backend work and still show
  // "query took 0.0ms" because whatever ran *after* the walk (usually
  // nothing, since the target branch is normally already loaded) was the
  // only thing ever counted.
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  const data = await res.json();
  lineInfoCache[key] = data;
  return data;
}

async function fetchPredecessors(branchId, dentryId) {
  const res = await fetch(`branches/${branchId}/lines/${dentryId}/predecessors`);
  if (!res.ok) return [];
  const ms = parseFloat(res.headers.get("X-Query-Time-Ms"));
  if (!isNaN(ms)) branchQueryTimeMs += ms;
  return await res.json();
}

async function resolvePrevReal(branchId, dentryId, visited) {
  visited = visited || new Set();
  const key = `${branchId}:${dentryId}`;
  if (visited.has(key)) return null;  // cycle guard, same reasoning as the forward walk
  visited.add(key);

  const preds = await fetchPredecessors(branchId, dentryId);
  if (!preds.length) return null;  // true root - nothing points here at all

  preds.sort((a, b) => a.branch_id - b.branch_id || a.dentry_id - b.dentry_id);

  for (const p of preds) {
    const info = await fetchLineInfo(p.branch_id, p.dentry_id);
    if (!info) continue;
    if (!info.is_system) {
      return { branchId: p.branch_id, dentryId: p.dentry_id };
    }
    const deeper = await resolvePrevReal(p.branch_id, p.dentry_id, visited);
    if (deeper) return deeper;
  }
  return null;
}

async function goBack() {
  const out = document.getElementById("explorer");
  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.disabled = true;
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  try {
    backTrail.add(`${currentAnchorBranchId}:${currentAnchorDentryId}`);
    const prev = await resolvePrevReal(currentAnchorBranchId, currentAnchorDentryId);
    if (!prev) {
      const status = document.getElementById("explorerTitle");
      const orig = status.textContent;
      status.textContent = "(already at the branch's root - nothing further back)";
      setTimeout(() => { status.textContent = orig; }, 2000);
      return;
    }
    // The graph genuinely loops in places (see backTrail's own comment) -
    // without this check, backing up through one of those cycles never
    // terminates: it keeps finding a real predecessor forever, just
    // cycling through the same handful of nodes instead of reaching a
    // root. Once "back" would return to a node this same streak of
    // presses already passed through, there's nothing new further back to
    // show, so it stops here instead of looping.
    if (backTrail.has(`${prev.branchId}:${prev.dentryId}`)) {
      const status = document.getElementById("explorerTitle");
      const orig = status.textContent;
      status.textContent = "(this branch loops back on itself here - no further unique content going back)";
      setTimeout(() => { status.textContent = orig; }, 2500);
      return;
    }
    await renderChainFrom(prev.branchId, prev.dentryId);
  } finally {
    if (backBtn) backBtn.disabled = false;
  }
}

async function restartBranch() {
  backTrail = new Set();  // a forward move breaks any "back" streak
  branchQueryTimeMs = 0;  // this action's own timing window starts here
  // Same reasoning as runBranchExplorer's cold-open check - "restart" is
  // just as much a fresh, unconditional re-entry as a cold URL open is.
  if (branchData && branchData.branch_id === rootBranchId && branchData.true_entry) {
    renderTrueEntryNotice(document.getElementById("explorer"), rootBranchId, branchData.true_entry);
    return;
  }
  await renderChainFrom(rootBranchId, 0);
}

// --- site header + update check ----------------------------------------
// The "back to home" link only makes sense on the real arda0.net
// deployment - a self-hoster running their own copy of this repo doesn't
// want a link pointing at someone else's site, so it's only inserted
// (never just hidden via CSS, to avoid a flash-then-hide) when the page
// is actually being viewed on arda0.net.
if (location.hostname === "arda0.net") {
  document.getElementById("site-header").innerHTML =
    `<a href="https://arda0.net" class="back-link">&larr; back to home</a>`;
}

// "1.2.10" > "1.2.9" as strings would say the opposite (lexicographic, not
// numeric) - compares component-by-component instead. Returns true only if
// a is strictly greater than b; anything malformed/equal/lower is false.
function isNewerVersion(a, b) {
  const pa = a.split(".").map(Number);
  const pb = b.split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const na = pa[i] || 0, nb = pb[i] || 0;
    if (isNaN(na) || isNaN(nb)) return false;  // malformed - don't guess
    if (na !== nb) return na > nb;
  }
  return false;
}

// Compares this deployment's version.txt against the same file on the
// configured GitHub repo's main branch. Entirely client-side, entirely
// optional (config.yaml's update_check.enabled, on by default) - failure
// (offline, GitHub rate-limited, repo not published yet) is silent, this
// is a courtesy notice, not something to ever block or nag about.
async function checkForUpdate() {
  try {
    const cfg = await (await fetch("app-config")).json();
    if (!cfg.update_check_enabled) return;

    const localVersion = (await (await fetch("version.txt")).text()).trim();
    const remoteRes = await fetch(
      `https://raw.githubusercontent.com/${cfg.github_repo}/main/version.txt`
    );
    if (!remoteRes.ok) return;  // repo/file not published yet, or offline - say nothing
    const remoteVersion = (await remoteRes.text()).trim();

    // Was a plain !== check - flagged as confusing when a dev/staging box
    // runs ahead of what's actually been pushed to GitHub (its own version
    // is newer, not older, but the notice showed anyway since it was just
    // "different"). Only show it when GitHub is actually ahead.
    if (remoteVersion && isNewerVersion(remoteVersion, localVersion)) {
      document.getElementById("version-notice").innerHTML =
        `a newer version is available on `
        + `<a href="https://github.com/${cfg.github_repo}" target="_blank" rel="noopener">GitHub</a>`
        + ` (running ${escapeHtml(localVersion)}, latest is ${escapeHtml(remoteVersion)})`;
    }
  } catch (e) {
    // offline, CORS hiccup, whatever - not worth surfacing for a courtesy check
  }
}
checkForUpdate();

// --- boot -------------------------------------------------------------
render(Object.fromEntries(new URLSearchParams(location.search)));
</script>
</body>
</html>
