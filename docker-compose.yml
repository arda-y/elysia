# all values can be changed to your liking, provided you know what you are doing
services:
  elysia:
    build: .
    container_name: elysia
    restart: always
    ports:
      - "127.0.0.1:2005:2005"
    volumes:
      # Read-only, and still bind-mounted rather than baked into the image
      # via the Dockerfile's own COPY, even though it now lives in this
      # project's own db/ - a rebuild still shouldn't have to re-copy 3GB
      # into a fresh image layer every time. The extraction/matching
      # pipeline that originally produced this file (de-voice-extract) is
      # retired (2026-08-27) - if this file ever needs regenerating, that
      # whole pipeline (game download, asset extraction, actor/dentry
      # matching) would need rebuilding from scratch first.
      - /home/arda/projects/elysia/db/voice_archive.db:/app/db/voice_archive.db:ro
      # GET /audio's own per-IP request/ban log - a real host directory
      # (not baked into the image) so it survives every rebuild/restart,
      # for after-the-fact scraping diagnosis. The host user's own uid
      # (1000) already matches the container's appuser, so no extra
      # chmod is needed for the container to write into it.
      - /home/arda/projects/elysia/logs:/app/logs

  # Dev/WIP instance for the frontend rewrite (2026-08-28) - not built from
  # the image, bind-mounts the live repo dir straight over /app so edits to
  # index.html/frontend/*.js show up on refresh with no rebuild or
  # docker cp, and --reload picks up main.py edits without a restart. Own
  # logs dir so its per-IP audio-ban counters never mix with prod's real
  # ones. Never touches prod's container/port/volumes above.
  elysia-dev:
    build: .
    container_name: elysia-dev
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "2005", "--reload"]
    ports:
      - "127.0.0.1:2015:2005"
    volumes:
      - /home/arda/projects/elysia:/app
      - /home/arda/projects/elysia/logs-dev:/app/logs
